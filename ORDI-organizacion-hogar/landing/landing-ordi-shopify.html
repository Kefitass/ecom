<script>
window.WIGY_DOM = {
  form: function() {
    return document.querySelector(".js-product-form") ||
           document.getElementById("product_form") ||
           document.querySelector("product-form form[action*='/cart/add']") ||
           document.querySelector("form[id^='product-form-template']") ||
           document.querySelector("form.product-form[action*='/cart/add']") ||
           document.querySelector("form[action*='/cart/add']:not(.installment)");
  },
  btn: function() {
    var f = this.form();
    return document.querySelector(".js-prod-submit-form") ||
           (f && f.querySelector(".product-form__submit, button[name='add'], [type='submit']")) ||
           document.querySelector("button[name='add']");
  },
  title: function() {
    return document.querySelector(".js-product-name") ||
           document.querySelector("[data-store='product-name']") ||
           document.querySelector(".product__title h1") ||
           document.querySelector(".product__title") ||
           document.querySelector("h1");
  },
  qty: function() {
    return document.querySelector(".js-quantity-input") ||
           document.querySelector(".product-form__quantity input[name='quantity']") ||
           document.querySelector("input[name='quantity']");
  },
  /* Contenedor de ANCHO COMPLETO para las secciones largas de la landing.
     Se crea justo DEBAJO de la sección del producto (foto + columna de compra),
     así las secciones ocupan todo el ancho en PC en lugar de la columna derecha. */
  fullWidth: function() {
    var c = document.getElementById("wigy-landing-full");
    if (c) return c;
    var f = this.form();
    if (!f) return null;
    var host = document.getElementById("wigy-preview-page") ||
               f.closest(".shopify-section") ||
               f.closest("section") ||
               f.closest(".product, product-info");
    c = document.createElement("div");
    c.id = "wigy-landing-full";
    if (host && host.parentNode) host.insertAdjacentElement("afterend", c);
    else f.appendChild(c);
    return c;
  }
};
</script>

<!-- ================================================================
     VALIDACIÓN DE SLUG + MODO PRUEBA
     · En Shopify: solo carga en la URL del producto (compara por handle
       /products/xxx, funciona desde /collections/... y con ?variant=...).
     · MODO PRUEBA (sin validación de URL): se activa solo cuando el archivo
       se abre localmente (file://), en localhost/127.0.0.1, con ?wigy_preview=1
       en la URL, o con modoPrueba: true en el panel. Si la página no tiene
       formulario de producto, crea uno simulado para ver la landing completa.
     ================================================================ -->
<script>
(function() {
  var cfg = window.WIGY_CONFIG || {};
  var loc = window.location;
  var isLocal = loc.protocol === "file:" ||
                /^(localhost|127\.0\.0\.1|0\.0\.0\.0|\[::1\])$/.test(loc.hostname);
  var forced = cfg.modoPrueba === true || /[?&]wigy_preview=1\b/.test(loc.search);
  window.WIGY_PREVIEW = isLocal || forced;

  if (!window.WIGY_PREVIEW) {
    var slugURL = cfg.slugURL;
    if (!slugURL || slugURL.indexOf("⚠️") !== -1) return;
    try {
      var configPath = new URL(slugURL).pathname.replace(/\/+$/, "");
      var currentPath = loc.pathname.replace(/\/+$/, "");
      var m = configPath.match(/\/products\/[^\/]+$/);
      var ok = m ? (currentPath.slice(-m[0].length) === m[0]) : (currentPath === configPath);
      if (!ok) window.WIGY_SLUG_BLOCK = true;
    } catch(e) {
      window.WIGY_SLUG_BLOCK = true;
    }
    return;
  }

  /* ---------- MODO PRUEBA: página de producto simulada ---------- */
  window.WIGY_SLUG_BLOCK = false;
  function buildMock() {
    if (document.getElementById("wigy-preview-page") || window.WIGY_DOM.form()) return;
    if (!document.body) return;
    var st = document.createElement("style");
    st.id = "wigy-preview-style";
    st.textContent =
      "body{margin:0;background:#fff;color:#1f1f1f;font-family:'DM Sans','Lato',sans-serif}" +
      "#wigy-preview-banner{background:#C65D3B;color:#fff;text-align:center;font:600 12px/1.4 'DM Sans',sans-serif;padding:6px 12px}" +
      "#wigy-preview-page{max-width:1200px;margin:0 auto;padding:24px 16px 40px;box-sizing:border-box}" +
      "#wigy-preview-page .wp-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:48px;align-items:start}" +
      "#wigy-preview-page .wp-gallery{position:sticky;top:16px}" +
      "#wigy-preview-page .wp-main{position:relative;width:100%;border-radius:16px;overflow:hidden;background:#F5F0E8;border:1px solid rgba(47,42,38,.12);display:flex;align-items:center;justify-content:center}" +
      "#wigy-preview-page .wp-main img{display:block;width:auto;max-width:100%;height:auto;max-height:80vh;object-fit:contain}" +
      "#wigy-preview-page .wp-thumbs{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}" +
      "#wigy-preview-page .wp-thumbs button{width:68px;height:68px;padding:0;border:2px solid transparent;border-radius:10px;overflow:hidden;background:#F5F0E8;cursor:pointer}" +
      "#wigy-preview-page .wp-thumbs button.active{border-color:#2F2A26}" +
      "#wigy-preview-page .wp-thumbs img{width:100%;height:100%;object-fit:cover;display:block}" +
      "#wigy-preview-page .wp-info{min-width:0}" +
      "#wigy-preview-page .wp-grid.no-gallery{grid-template-columns:minmax(0,620px);justify-content:center}" +
      "@media(max-width:768px){#wigy-preview-page .wp-main img{width:auto;max-width:100%;max-height:min(85vw,360px)}#wigy-preview-page .wp-grid{display:block}#wigy-preview-page .wp-gallery{position:static;margin-bottom:20px}#wigy-preview-page .wp-thumbs button{width:56px;height:56px}}" +
      "#wigy-preview-page h1{font:800 28px/1.2 'Fraunces',Georgia,serif;color:#1f1f1f;margin:0 0 4px}" +
      "#wigy-preview-page .wp-form{margin:0}" +
      "@media(max-width:768px){#wigy-preview-page h1{font-size:23px}}";
    document.head.appendChild(st);

    var banner = document.createElement("div");
    banner.id = "wigy-preview-banner";
    banner.textContent = "MODO PRUEBA — vista local de la landing (en Shopify este aviso no aparece)";

    var page = document.createElement("div");
    page.id = "wigy-preview-page";
    var fotos = (cfg.fotosProducto || []).filter(function(u) { return u && u.indexOf("\u26A0\uFE0F") === -1; });
    var galleryHTML = fotos.length ?
      '<div class="wp-gallery">' +
        '<div class="wp-main"><img src="' + fotos[0] + '" alt="' + (cfg.nombreProducto || "") + '"></div>' +
        (fotos.length > 1 ? '<div class="wp-thumbs">' + fotos.map(function(u, i) {
          return '<button type="button" class="' + (i === 0 ? 'active' : '') + '" data-src="' + u + '"><img src="' + u + '" alt="Foto ' + (i + 1) + '"></button>';
        }).join('') + '</div>' : '') +
      '</div>' : '';
    page.innerHTML =
      '<div class="wp-grid' + (fotos.length ? '' : ' no-gallery') + '">' + galleryHTML +
      '<div class="wp-info">' +
        '<h1 class="product__title">' + (cfg.nombreProducto || "Producto") + '</h1>' +
        '<form class="wp-form product-form" action="/cart/add" method="post" id="product-form-preview">' +
          '<input type="hidden" name="quantity" value="1">' +
          '<div class="product-form__buttons">' +
            '<button type="submit" name="add" class="product-form__submit">Agregar al carrito</button>' +
          '</div>' +
        '</form>' +
      '</div></div>';

    var anchor = document.getElementById("wigy-ordi-scripts");
    if (anchor && anchor.parentNode) {
      anchor.parentNode.insertBefore(banner, anchor);
      anchor.parentNode.insertBefore(page, anchor);
    } else {
      document.body.appendChild(banner);
      document.body.appendChild(page);
    }

    page.querySelectorAll(".wp-thumbs button").forEach(function(t) {
      t.addEventListener("click", function() {
        page.querySelector(".wp-main img").src = t.getAttribute("data-src");
        page.querySelectorAll(".wp-thumbs button").forEach(function(x) { x.classList.remove("active"); });
        t.classList.add("active");
      });
    });

    page.querySelector("form").addEventListener("submit", function(e) {
      e.preventDefault();
      var q = page.querySelector("input[name='quantity']").value;
      alert("Modo prueba: se agregarían " + q + " unidad(es) al carrito.");
    });
  }
  buildMock();
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", buildMock);
})();
</script>
<!-- ================================================================
     BLOQUE PRECARGA: Carga anticipada de TODAS las imágenes
     ================================================================ -->
<script>
(function() {
  if (window.WIGY_SLUG_BLOCK) return;
  var cfg = window.WIGY_CONFIG;
  if (!cfg) return;

  /* Imágenes CRÍTICAS — preload con <link> en el <head> (máxima prioridad del navegador) */
  var critical = [];
  if (cfg.lookbook) cfg.lookbook.forEach(function(l) { critical.push(l.src); });
  if (cfg.fotoEstadisticas) critical.push(cfg.fotoEstadisticas);
  if (cfg.experto && cfg.experto.foto) critical.push(cfg.experto.foto);
  critical.forEach(function(url) {
    if (!url || url.indexOf("\u26A0\uFE0F") !== -1) return;
    var link = document.createElement("link");
    link.rel = "preload";
    link.as = "image";
    link.href = url;
    document.head.appendChild(link);
  });

  /* Resto de imágenes — preload con new Image() */
  var urls = [];
  if (cfg.carruselImagenes && cfg.mostrarCarrusel !== false) cfg.carruselImagenes.forEach(function(item) { urls.push(item.src); });
  if (cfg.testimonios) cfg.testimonios.forEach(function(t) { if (t.foto) urls.push(t.foto); });
  if (cfg.logosMediaTicker) cfg.logosMediaTicker.forEach(function(l) { urls.push(l.src); });
  urls.forEach(function(url) {
    if (!url || url.indexOf("\u26A0\uFE0F") !== -1) return;
    var img = new Image();
    img.src = url;
  });
})();
</script>
<!-- ================================================================
     BLOQUE 0A: RATING GENERAL (ESTRELLAS + CALIFICACIONES)
     ================================================================ -->
<script>
(function() {
  if (window.WIGY_SLUG_BLOCK) return;
  var ID = "wigy-product-rating";
  var STYLE_ID = ID + "-style";

  function injectStyleOnce() {
    if (document.getElementById(STYLE_ID)) return;
    var css =
      "#" + ID + "{display:flex;align-items:center;gap:8px;margin:4px 0 10px 0;font-family:inherit}" +
      "#" + ID + " .wr-stars{display:flex;align-items:center;gap:1px}" +
      "#" + ID + " .wr-stars svg{width:16px;height:16px}" +
      "#" + ID + " .wr-score{font-size:14px;font-weight:700;color:#2F2A26;line-height:1}" +
      "#" + ID + " .wr-count{font-size:13px;font-weight:500;color:#666;line-height:1}" +
      "#" + ID + " .wr-count span{text-decoration:underline;cursor:pointer}" +
      "@media(max-width:768px){#" + ID + " .wr-stars svg{width:14px;height:14px}#" + ID + " .wr-score{font-size:13px}#" + ID + " .wr-count{font-size:12px}}";
    var st = document.createElement("style");
    st.id = STYLE_ID;
    st.innerHTML = css;
    document.head.appendChild(st);
  }

  function buildStars(rating) {
    var full = Math.floor(rating);
    var hasHalf = (rating - full) >= 0.3;
    var starFull = '<svg viewBox="0 0 24 24" fill="#A8896B" stroke="none"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87L18.18 22 12 18.27 5.82 22 7 14.14l-5-4.87 6.91-1.01z"/></svg>';
    var starHalf = '<svg viewBox="0 0 24 24" fill="none" stroke="none"><defs><linearGradient id="wrh"><stop offset="50%" stop-color="#A8896B"/><stop offset="50%" stop-color="#E0E0E0"/></linearGradient></defs><path d="M12 2l3.09 6.26L22 9.27l-5 4.87L18.18 22 12 18.27 5.82 22 7 14.14l-5-4.87 6.91-1.01z" fill="url(#wrh)"/></svg>';
    var starEmpty = '<svg viewBox="0 0 24 24" fill="#E0E0E0" stroke="none"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87L18.18 22 12 18.27 5.82 22 7 14.14l-5-4.87 6.91-1.01z"/></svg>';
    var html = '';
    for (var i = 0; i < full; i++) html += starFull;
    if (hasHalf) { html += starHalf; full++; }
    for (var j = full; j < 5; j++) html += starEmpty;
    return html;
  }

  function mount() {
    if (document.getElementById(ID)) return;
    var cfg = window.WIGY_CONFIG && window.WIGY_CONFIG.rating;
    if (!cfg) return;
    var rs = window.WIGY_CONFIG.resumenResenas;
    if (rs && rs.estrellas && !cfg.cantidadOpiniones && !cfg.clientes) {
      var e = rs.estrellas, tot = e.reduce(function(a, b) { return a + (+b || 0); }, 0);
      if (tot) cfg = { puntuacion: Math.round((e[0] * 5 + e[1] * 4 + e[2] * 3 + e[3] * 2 + e[4]) / tot * 10) / 10, cantidadOpiniones: tot, clientes: 0 };
    }
    var titleEl = window.WIGY_DOM.title();
    if (!titleEl) return;
    injectStyleOnce();
    var el = document.createElement("div");
    el.id = ID;
    el.innerHTML =
      '<div class="wr-stars">' + buildStars(cfg.puntuacion) + '</div>' +
      '<span class="wr-score">' + cfg.puntuacion.toFixed(1) + '</span>' +
      (cfg.clientes || cfg.cantidadOpiniones ? '<span class="wr-count"><span>' + (cfg.clientes ? '+' + Number(cfg.clientes).toLocaleString("es-AR") + ' clientes felices' : Number(cfg.cantidadOpiniones).toLocaleString("es-AR") + ' rese\u00F1as') + '</span></span>' : '');
    titleEl.insertAdjacentElement("afterend", el);
    el.style.cursor = "pointer";
    el.addEventListener("click", function() {
      var r = document.getElementById("wigy-testimonials-slider-standalone");
      if (r) r.scrollIntoView({ behavior: "smooth", block: "start" });
    });
  }

  var tries = 0;
  var t = setInterval(function() {
    tries++;
    mount();
    if (document.getElementById(ID) || tries >= 60) clearInterval(t);
  }, 250);
})();
</script>

ant;align-items:center!important;justify-content:center!important;text-align:center!important;box-sizing:border-box!important;min-height:0!important}.js-prod-submit-form::before,.js-prod-submit-form::after,button[name='add']::before,button[name='add']::after,.product-form__submit::before,.product-form__submit::after{display:none!important;content:none!important}.product-form__submit>span,button[name='add']>span{background:none!important;box-shadow:none!important;border:0!important}.js-prod-submit-form:hover,button[name='add']:hover,.btn-add-to-cart:hover,.product-form__submit:hover{transform:translateY(-3px)!important;background:linear-gradient(135deg,#000000 0%,#2F2A26 100%)!important}@keyframes kbSlideIn{0%{opacity:0;transform:translateY(20px) scale(0.95)}60%{opacity:1;transform:translateY(-3px) scale(1.02)}100%{opacity:1;transform:translateY(0) scale(1)}}@keyframes kbPopBounce{0%{opacity:0;transform:scale(0.2) rotate(-5deg)}50%{opacity:1;transform:scale(1.35) rotate(4deg)}75%{opacity:1;transform:scale(0.9) rotate(-2deg)}100%{opacity:1;transform:scale(1) rotate(0deg)}}.kb-in-view .kb-title{animation:kbSlideIn 0.6s cubic-bezier(0.175,0.885,0.32,1.275) forwards}.kb-in-view .kb-pop{animation:kbPopBounce 0.7s cubic-bezier(0.175,0.885,0.32,1.275) forwards}.kb-in-view .kb-bdg{animation:kbPopBounce 0.7s cubic-bezier(0.175,0.885,0.32,1.275) forwards}.kb-in-view .kb-bar:nth-child(3) .kb-pop{animation-delay:0.15s}.kb-in-view .kb-bar:nth-child(4) .kb-pop{animation-delay:0.35s}.kb-in-view .kb-bar:nth-child(3) .kb-bdg{animation-delay:0.25s}.kb-in-view .kb-bar:nth-child(4) .kb-bdg{animation-delay:0.45s}@media(max-width:768px){.kb-t{font-size:16px}.kb-p{font-size:18px}.kb-s{font-size:13.5px}.kb-op{font-size:13.5px}.js-prod-submit-form,button[name='add'],.btn-add-to-cart,.product-form__submit{font-size:18px!important;padding:18px 20px!important}}@media(max-width:480px){.kb-title{white-space:normal;text-align:center;font-size:15px}}";

    if (window.WIGY_CONFIG.mostrarPacks === false && (hasKaching || !window.WIGY_PREVIEW)) {

      marker.id = ID;
      marker.style.display = 'none';
      pCol.parentNode.insertBefore(marker, pCol);
      pCol.classList.add('wigy-atc-col');
      pCol.style.setProperty('margin-left', 'auto', 'important');
      pCol.style.setProperty('margin-right', 'auto', 'important');
      pCol.style.setProperty('width', '100%', 'important');
      pCol.style.setProperty('max-width', '600px', 'important');

      var sel = o.seleccionado ? ' sel' : '';

      var bdg = o.descuento ? ' <span class="kb-bdg">' + o.descuento + '</span>' : '';
      var oldP = o.precioViejo ? '<span class="kb-op">' + o.precioViejo + '</span>' : '';
      var gift = o.regalo ? '<div class="kb-gifts"><div class="kb-gift-row"><span class="kb-gift-check">' + giftCheckSVG + '</span><span>' + o.regalo + '</span><span class="kb-gift-tag">GRATIS</span></div></div>' : '';
      return '<div class="kb-bar' + sel + '" data-qty="' + o.cantidad + '">' + pop + '<div class="kb-main"><div class="kb-radio"></div><div class="kb-c"><div class="kb-r1"><span class="kb-t">' + o.nombre + bdg + '</span><span class="kb-p">' + o.precio + '</span></div><div class="kb-r2"><span class="kb-s">' + o.subtexto + '</span>' + oldP + '</div></div></div>' + gift + '</div>';
    }).join('');

    pCol.parentNode.insertBefore(w, pCol);

    /* FIX: botón centrado en escritorio.

       Ahora la columna se centra con margin auto (CSS .wigy-atc-col) en cualquier ancho. */
    pCol.classList.add('wigy-atc-col');
    pCol.style.setProperty('margin-left', 'auto', 'important');
    pCol.style.setProperty('margin-right', 'auto', 'important');
    pCol.style.setProperty('margin-top', '0px', 'important');
    pCol.style.setProperty('padding-top', '0px', 'important');
    pCol.style.setProperty('margin-bottom', '15px', 'important');
    pCol.style.setProperty('width', '100%', 'important');
    pCol.style.setProperty('max-width', '600px', 'important');

    var viewTimer;
    var observer = new IntersectionObserver(function(entries, obs) {
      entries.forEach(function(entry) {
        if (entry.isIntersecting) {
          viewTimer = setTimeout(function() { w.classList.add('kb-in-view'); obs.unobserve(w); }, 300);
        } else {
          clearTimeout(viewTimer);
        }
      });
    }, { threshold: 0.3 });
    observer.observe(w);

    w.querySelectorAll('.kb-bar').forEach(function(el) {
      el.onclick = function() {
        w.querySelectorAll('.kb-bar').forEach(function(i) { i.classList.remove('sel'); });
        el.classList.add('sel');
        var qt = parseInt(el.dataset.qty);
        var inp = window.WIGY_DOM.qty();
        var bP = document.querySelector('.js-quantity-up');
        var bM = document.querySelector('.js-quantity-down');
        if (inp) { inp.value = qt; inp.dispatchEvent(new Event('change', { bubbles: true })); }
        if (inp && bP && bM) {
          var c = parseInt(inp.value) || 1;
          while (c < qt) { bP.click(); c++; }
          while (c > qt) { bM.click(); c--; }
        }
      };
    });

    setTimeout(function() { var def = w.querySelector('.kb-bar.sel'); if (def) def.click(); }, 400);
  };

  var t = setInterval(function() { inject(); if (document.getElementById(ID)) clearInterval(t); }, 250);
})();

<script>
(function() {
  if (window.WIGY_SLUG_BLOCK) return;
  var BOX_ID   = "wigy-garantia-box";
  var STYLE_ID = "wigy-garantia-style";


  function injectStyleOnce() {
    if (document.getElementById(STYLE_ID)) return;

    var css =
      "#" + BOX_ID + "{display:block!important;width:100%!important;margin:10px 0 16px 0!important}" +

      "#" + BOX_ID + " .wigy-garantia-content{" +
        "position:relative!important;overflow:hidden!important;" +
        "width:100%!important;max-width:520px!important;margin:0 auto!important;" +
        "display:flex!important;align-items:flex-start!important;gap:10px;" +
        "padding:12px 14px;border:1px solid rgba(47,42,38,.25);border-radius:12px;" +
        "background:#F5F0E8;box-shadow:0 2px 10px rgba(0,0,0,.06);box-sizing:border-box;" +
      "}" +

      "#" + BOX_ID + " .wigy-garantia-icon{width:18px;height:18px;flex:0 0 auto;color:#2F2A26;margin-top:2px}" +
      "#" + BOX_ID + " .wigy-garantia-text{display:flex;flex-direction:column;gap:4px}" +
      "#" + BOX_ID + " .wigy-garantia-title{margin:0;font-size:14px;font-weight:800;line-height:1.1;color:#2F2A26}" +
      "#" + BOX_ID + " .wigy-garantia-desc{margin:0;font-size:12.5px;font-weight:600;line-height:1.35;color:rgba(0,0,0,.72)}" +

      "#" + BOX_ID + " .wigy-garantia-shine{" +
        "pointer-events:none;position:absolute;" +
        "top:-80%;left:-160%;width:80%;height:260%;" +
        "background:linear-gradient(105deg,transparent 15%,rgba(255,255,255,0.25) 30%,rgba(255,255,255,0.92) 50%,rgba(255,255,255,0.25) 70%,transparent 85%);" +
        "transform:skewX(-12deg);opacity:0;" +
      "}" +

      "@keyframes wigy-shine-sweep{" +
        "0%{left:-160%;opacity:0}" +
        "6%{opacity:1}" +
        "90%{opacity:1}" +
        "100%{left:190%;opacity:0}" +
      "}" +

      "#" + BOX_ID + ".wigy-animate .wigy-garantia-shine{" +
        "animation:wigy-shine-sweep 2.6s cubic-bezier(0.25,0.46,0.45,0.94) 0.4s forwards;" +
      "}";

    var st = document.createElement("style");
    st.id = STYLE_ID;
    st.type = "text/css";
    st.appendChild(document.createTextNode(css));
    document.head.appendChild(st);
  }

  function createBox() {
    var box = document.createElement("div");
    box.id = BOX_ID;
    box.innerHTML =
      '<div class="wigy-garantia-content">' +
        '<div class="wigy-garantia-shine" aria-hidden="true"></div>' +
        '<svg class="wigy-garantia-icon" viewBox="0 0 24 24" aria-hidden="true">' +
          '<path fill="currentColor" d="M12 2l8 4v6c0 5-3.4 9.4-8 10-4.6-.6-8-5-8-10V6l8-4zm-1 14l6-6-1.4-1.4L11 13.2 8.4 10.6 7 12l4 4z"/>' +
        '</svg>' +
        '<div class="wigy-garantia-text">' +
          '<p class="wigy-garantia-title">' + (function(){var d=(window.WIGY_CONFIG&&window.WIGY_CONFIG.garantiaDias)||0;return d?'Garant\u00EDa de '+d+' d\u00EDas':'Garant\u00EDa 100%';})() + ' \u00B7 Compra protegida</p>' +
          '<p class="wigy-garantia-desc">Pagos seguros, despacho en 24 hs h\u00E1biles y atenci\u00F3n al cliente 24/7. Si llegan con un defecto, te las cambiamos. Si algo no est\u00E1 bien con tu pedido, te lo resolvemos.</p>' +
        '</div>' +
      '</div>';
    return box;
  }

  function attachShineObserver(box) {
    if (!window.IntersectionObserver) {
      setTimeout(function() { box.classList.add("wigy-animate"); }, 700);
      return;
    }
    var io = new IntersectionObserver(function(entries, obs) {
      entries.forEach(function(entry) {
        if (entry.isIntersecting) {
          box.classList.add("wigy-animate");
          obs.unobserve(box);
        }
      });
    }, { threshold: 0.5 });
    io.observe(box);
  }

  function mount() {
    if (document.getElementById(BOX_ID)) return;
    var form = window.WIGY_DOM.form();
    if (!form) return;
    injectStyleOnce();
    var box = createBox();
    var urgency = document.getElementById("js-urgency-last-units");
    if (urgency && urgency.parentNode === form) {
      urgency.insertAdjacentElement("afterend", box);
    } else {
      form.appendChild(box);
    }
    attachShineObserver(box);
  }

  mount();
  var tries = 0;
  var t = setInterval(function() {
    tries++;
    mount();
    if (document.getElementById(BOX_ID) || tries >= 80) clearInterval(t);
  }, 250);
})();
</script>

  function injectStyleOnce() {
    if (document.getElementById(STYLE_ID)) return;
    var css = [
      "#" + ID + "{width:100%;max-width:1200px;margin:0 auto;padding:30px 0 40px 0;overflow:hidden;position:relative}",

      "#" + ID + " .media-ticker-label{text-align:center;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:1.5px;color:#3B342F;opacity:.7;margin-bottom:18px}",

      "#" + ID + " .media-ticker-track{display:flex;align-items:center;gap:60px;width:max-content;",
      "animation:wigy-media-scroll 20s linear infinite;animation-play-state:paused}",

      "#" + ID + " .media-ticker-track.running{animation-play-state:running}",

      "#" + ID + " .media-ticker-track img{height:28px;width:auto;object-fit:contain;",
      "filter:grayscale(100%) opacity(0.5);transition:filter 0.3s ease;flex:0 0 auto}",

      "#" + ID + " .media-ticker-track img:hover{filter:grayscale(0%) opacity(1)}",

      "@keyframes wigy-media-scroll{to{transform:translateX(calc(-50% - 30px))}}",

      "@media(max-width:768px){",
      "#" + ID + "{padding:20px 0 30px 0}",
      "#" + ID + " .media-ticker-track{gap:40px;animation-duration:15s}",
      "#" + ID + " .media-ticker-track img{height:22px}",
      "#" + ID + " .media-ticker-label{font-size:11px;letter-spacing:1.2px}}"
    ].join("");
    var st = document.createElement("style");
    st.id = STYLE_ID;
    st.innerHTML = css;
    document.head.appendChild(st);
  }

  function mount() {
    if (document.getElementById(ID)) return true;
    var faqsBlock = document.getElementById("wigy-shopify-faqs-accordion");
    if (!faqsBlock) return false;
    var logos = window.WIGY_CONFIG && window.WIGY_CONFIG.logosMediaTicker;
    if (!logos || !logos.length) return true; // sin logos: no se muestra la barra

    injectStyleOnce();

    var REPEATS = 8;
    var imgsHTML = "";
    for (var r = 0; r < REPEATS; r++) {
      for (var i = 0; i < logos.length; i++) {
        imgsHTML += '<img src="' + logos[i].src + '" alt="' + (logos[i].alt || '') + '" draggable="false">';
      }
    }

    var wrapper = document.createElement("div");
    wrapper.id = ID;
    wrapper.innerHTML =
      '<p class="media-ticker-label">Visto en medios de comunicaci\u00F3n</p>' +
      '<div class="media-ticker-track-wrap"><div class="media-ticker-track">' + imgsHTML + '</div></div>';

    faqsBlock.insertAdjacentElement("afterend", wrapper);

    /* Esperar a que las primeras N imágenes carguen antes de animar */
    var track = wrapper.querySelector(".media-ticker-track");
    var uniqueCount = logos.length;
    var loaded = 0;
    var firstBatch = track.querySelectorAll("img");
    function checkReady() {
      loaded++;
      if (loaded >= uniqueCount) track.classList.add("running");
    }
    for (var j = 0; j < Math.min(uniqueCount, firstBatch.length); j++) {
      if (firstBatch[j].complete) { checkReady(); }
      else { firstBatch[j].onload = firstBatch[j].onerror = checkReady; }
    }
    /* Fallback: forzar arranque a los 3 segundos */
    setTimeout(function() { track.classList.add("running"); }, 3000);

    return true;
  }

  var tries = 0;
  var t = setInterval(function() {
    tries++;
    if (mount() || tries >= 120) clearInterval(t);
  }, 200);
})();
</script>

  function initTimelineScroll(wrapper) {
    var track = wrapper.querySelector('.timeline-track');
    var fillLine = wrapper.querySelector('.timeline-progress-fill');
    if (!track || !fillLine) return;
    var pills = Array.prototype.slice.call(wrapper.querySelectorAll('.t-pill-orange'));
    var popped = pills.map(function() { return false; });
    var maxFill = 0;
    var rafId = null;

    function triggerPop(pill) {
      pill.classList.remove('pop'); void pill.offsetWidth; pill.classList.add('pop');
      pill.addEventListener('animationend', function() { pill.classList.remove('pop'); }, { once: true });
    }

    function update() {
      rafId = null;
      var rect = track.getBoundingClientRect();
      var triggerPt = window.innerHeight * 0.65;
      var pct = Math.max(0, Math.min(1, (triggerPt - rect.top) / rect.height));
      if (pct > maxFill) {
        maxFill = pct;
        fillLine.style.transform = 'scaleY(' + maxFill + ')';
        pills.forEach(function(pill, i) {
          if (popped[i]) return;
          var pr = pill.getBoundingClientRect();
          var center = pr.top + pr.height / 2 - rect.top;
          if (maxFill >= center / rect.height) { popped[i] = true; triggerPop(pill); }
        });
      }
    }

    window.addEventListener('scroll', function() { if (!rafId) rafId = requestAnimationFrame(update); }, { passive: true });
    window.addEventListener('resize', function() { rafId = requestAnimationFrame(update); }, { passive: true });
    requestAnimationFrame(update);
  }

          (window.WIGY_CONFIG.estadisticas || []).map(function(e) { return '<div class="results__row"><div class="results__percentage" data-target="' + parseInt(e.porcentaje, 10) + '"><p>0%</p></div><div class="results__text"><p>' + e.texto + '</p></div></div>'; }).join('') +
        '</div>' +
      '</div>' +
    '</div>';
  }

  function animateRings(wrapper) {
    var rings = wrapper.querySelectorAll(".results__percentage");
    var DURATION = 1800;
    var STAGGER = 200;

    rings.forEach(function(ring, index) {
      var target = parseInt(ring.getAttribute("data-target"));
      var numEl = ring.querySelector("p");
      var startTime = null;
      var delay = index * STAGGER;

      setTimeout(function() {
        function tick(timestamp) {
          if (!startTime) startTime = timestamp;
          var elapsed = timestamp - startTime;
          var progress = Math.min(elapsed / DURATION, 1);
          var eased = 1 - Math.pow(1 - progress, 3);
          var currentVal = Math.round(eased * target);
          var currentDeg = (eased * target / 100) * 360;
          numEl.textContent = currentVal + "%";
          ring.style.background = "conic-gradient(#A8896B " + currentDeg + "deg, #f1f5f9 " + currentDeg + "deg 360deg)";
          if (progress < 1) requestAnimationFrame(tick);
        }
        requestAnimationFrame(tick);
      }, delay);
    });
  }

  function mount() {
    if (document.getElementById(WRAPPER_ID)) return true;
    var concernsWidget = document.getElementById("wigy-concerns-standalone");
    if (!concernsWidget) return false;
    var stats = window.WIGY_CONFIG && window.WIGY_CONFIG.estadisticas;

    var wrapper = document.createElement("section");

    wrapper.innerHTML = buildHTML();
    concernsWidget.insertAdjacentElement("afterend", wrapper);

    var obs = new IntersectionObserver(function(entries, o) {
      if (entries[0].isIntersecting && !animated) {
        animated = true;
        o.unobserve(wrapper);
        animateRings(wrapper);
      }
    }, { threshold: 0.4 });
    obs.observe(wrapper);

    return true;
  }

  var tries = 0;
  var t = setInterval(function() { tries++; if (mount() || tries >= 80) clearInterval(t); }, 250);
})();
</script>

  }

  function positionOverlay(wrapper) {
    var thBrand = wrapper.querySelector(".th-brand");
    var lastBrand = wrapper.querySelectorAll(".cell-brand");
    var lastCell = lastBrand[lastBrand.length - 1];
    var tableWrapper = wrapper.querySelector(".comp-table-wrapper");
    var overlay = wrapper.querySelector(".comp-brand-bg");
    if (!thBrand || !lastCell || !tableWrapper || !overlay) return;
    var wrapperRect = tableWrapper.getBoundingClientRect();
    var thRect = thBrand.getBoundingClientRect();
    var lastRect = lastCell.getBoundingClientRect();
    overlay.style.top = (thRect.top - wrapperRect.top) + "px";
    overlay.style.left = (thRect.left - wrapperRect.left) + "px";
    overlay.style.width = thRect.width + "px";
    overlay.style.height = (lastRect.bottom - thRect.top) + "px";
  }

  function mount() {
    if (document.getElementById(WRAPPER_ID)) return true;
    var statsWidget = document.getElementById("wigy-clinical-results-standalone") || document.getElementById("wigy-concerns-standalone");

    var wrapper = document.createElement("section");

    wrapper.innerHTML = buildHTML();
    statsWidget.insertAdjacentElement("afterend", wrapper);

    setTimeout(function() { positionOverlay(wrapper); }, 100);
    window.addEventListener("resize", function() { positionOverlay(wrapper); });

    var animated = false;
    var obs = new IntersectionObserver(function(entries, o) {
      if (entries[0].isIntersecting && !animated) {
        animated = true;
        o.unobserve(wrapper);
        positionOverlay(wrapper);
        setTimeout(function() {
          wrapper.classList.add("wigy-revealed");
        }, 300);
      }
    }, { threshold: 0.2 });
    obs.observe(wrapper);

    return true;
  }

  var tries = 0;
  var t = setInterval(function() { tries++; if (mount() || tries >= 80) clearInterval(t); }, 250);
})();

ct-fit:cover}\n#" + WRAPPER_ID + " .multicolumn-card__info{padding:25px 20px;flex:1;display:flex;flex-direction:column;text-align:center;background:#ffffff}\n#" + WRAPPER_ID + " .rating-stars-and-text{display:flex;justify-content:center;margin-bottom:15px;color:#A8896B}\n#" + WRAPPER_ID + " .rating-stars__container{display:flex;gap:4px}\n#" + WRAPPER_ID + " .rating-stars__container svg{width:18px;height:18px}\n#" + WRAPPER_ID + " h3{font-size:20px;font-weight:800;color:#2F2A26;margin:0 0 10px 0}\n#" + WRAPPER_ID + " .rte p{font-size:15px;color:#555555;line-height:1.6;margin:0 0 18px 0}\n#" + WRAPPER_ID + " .testimonial-card__author{font-size:15px;font-weight:800;color:#2F2A26;margin-top:auto}\n#" + WRAPPER_ID + " .splide__arrow{position:absolute;top:50%;transform:translateY(-50%);width:50px;height:50px;border-radius:50%;background:#ffffff;border:1px solid #eaeaea;box-shadow:0 8px 20px rgba(0,0,0,0.12);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all 0.2s;padding:0;z-index:10}\n#" + WRAPPER_ID + " .splide__arrow--prev{left:0}\n#" + WRAPPER_ID + " .splide__arrow--next{right:0}\n#" + WRAPPER_ID + " .splide__arrow:hover:not(:disabled){background:#2F2A26;border-color:#2F2A26;transform:translateY(-50%) scale(1.1)}\n#" + WRAPPER_ID + " .splide__arrow svg{width:18px;height:18px;transition:0.2s;fill:#111}\n#" + WRAPPER_ID + " .splide__arrow:hover:not(:disabled) svg{fill:#ffffff}\n#" + WRAPPER_ID + " .splide__arrow:disabled{opacity:0.3;cursor:not-allowed}\n#" + WRAPPER_ID + " .splide__arrow--prev svg{transform:rotate(180deg)}\n#" + WRAPPER_ID + " .splide__pagination{display:flex;justify-content:center;gap:10px;list-style:none;padding:0;margin-top:25px}\n#" + WRAPPER_ID + " .splide__pagination__page{width:10px;height:10px;border-radius:50%;background:#d1d5db;border:none;cursor:pointer;transition:0.3s;padding:0}\n#" + WRAPPER_ID + " .splide__pagination__page.is-active{background:#2F2A26;transform:scale(1.4)}\n#" + WRAPPER_ID + " .testimonial-verified{display:inline-flex;align-self:center;justify-content:center;align-items:center;gap:4px;margin-top:8px;font-size:12px;font-weight:700;color:#2F2A26;line-height:1}\n#" + WRAPPER_ID + " .testimonial-verified svg{width:14px;height:14px;flex:0 0 auto}\n#" + WRAPPER_ID + " .testimonial-fit{display:inline-block;align-self:center;margin:0 0 10px 0;padding:4px 10px;border-radius:99px;background:#F5F0E8;color:#2F2A26;font-size:12px;font-weight:600}\n#" + WRAPPER_ID + " .wigy-verified-clients-bar{display:flex;align-items:center;justify-content:center;gap:6px;margin-bottom:12px;font-size:13px;font-weight:700;color:#2F2A26;letter-spacing:0.3px}\n#" + WRAPPER_ID + " .wigy-verified-clients-bar svg{width:16px;height:16px;flex:0 0 auto}\n@media(max-width:768px){#" + WRAPPER_ID + "{margin:30px auto 40px auto}#" + WRAPPER_ID + " .title-with-highlight{font-size:28px;margin-bottom:25px}#" + WRAPPER_ID + " .splide-wrapper{padding:0 15px}#" + WRAPPER_ID + " .splide__arrow{width:40px;height:40px}#" + WRAPPER_ID + " .splide__arrow--prev{left:-5px}#" + WRAPPER_ID + " .splide__arrow--next{right:-5px}#" + WRAPPER_ID + " h3{font-size:18px}#" + WRAPPER_ID + " .rte p{font-size:14.5px}}";
    var st = document.createElement("style");
    st.id = WRAPPER_ID + "-style";
    st.innerHTML = css;
    document.head.appendChild(st);
  }

  var STAR_SVG = '<svg viewBox="0 0 576 512" fill="currentColor"><path d="M316.9 18C311.6 7 300.4 0 288.1 0s-23.4 7-28.8 18L195 150.3 51.4 171.5c-12 1.8-22 10.2-25.7 21.7s-.7 24.2 7.9 32.7L137.8 329 113.2 474.7c-2 12 3 24.2 12.9 31.3s23 8 33.8 2.3l128.3-68.5 128.3 68.5c10.8 5.7 23.9 4.9 33.8-2.3s14.9-19.3 12.9-31.3L438.5 329 542.7 225.9c8.6-8.5 11.7-21.2 7.9-32.7s-13.7-19.9-25.7-21.7L381.2 150.3 316.9 18z"></path></svg>';
  var STARS_5 = '<div class="rating-stars-and-text"><div class="rating-stars__container">' + STAR_SVG.repeat(5) + '</div></div>';
  var ARROW_SVG = '<svg viewBox="0 0 40 40"><path d="m15.5 0.932-4.3 4.38 14.5 14.6-14.5 14.5 4.3 4.4 14.6-14.6 4.4-4.3-4.4-4.4-14.6-14.6z"></path></svg>';

  var VERIFIED_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>';

  function buildHTML() {
    var cfgTest = window.WIGY_CONFIG.testimonios;
    var cards = cfgTest.map(function(t) {
      return { img: t.foto, alt: t.nombre, title: t.titulo, text: t.texto, author: t.nombre, fit: t.ambiente ? 'Lo usa en: ' + t.ambiente : '' };
    });

    var cardsHTML = cards.map(function(c) {
      var hasImg = c.img && c.img.indexOf('\u26A0\uFE0F') === -1;
      var media = hasImg
        ? '<img src="' + c.img + '" alt="' + c.alt + '" loading="eager" class="multicolumn-card__image">'
        : '<div class="multicolumn-card__image" style="display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#2F2A26,#A8896B);color:#fff;font-size:72px;font-weight:700;font-family:var(--vd-font-title)">' + (c.author || '?').charAt(0).toUpperCase() + '</div>';
      return '<li class="splide__slide"><div class="multicolumn-card"><div class="multicolumn-card__image-wrapper">' + media + '</div><div class="multicolumn-card__info">' + STARS_5 + (c.fit ? '<span class="testimonial-fit">' + c.fit + '</span>' : '') + '<h3>' + c.title + '</h3><div class="rte"><p>' + c.text + '</p></div><p class="testimonial-card__author">' + c.author + '</p><span class="testimonial-verified">' + VERIFIED_SVG + ' Compra verificada</span></div></div></li>';
    }).join('');

    var dotsHTML = cards.map(function(_, i) {
      return '<li><button class="splide__pagination__page' + (i === 0 ? ' is-active' : '') + '" type="button"></button></li>';
    }).join('');

    var verifiedBarSvg = '<svg viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm-1.09 14.41l-3.5-3.5 1.41-1.41 2.09 2.09 5.18-5.18 1.41 1.41-6.59 6.59z"/></svg>';

    return '<h2 class="title-with-highlight">Casas más ordenadas, gente más tranquila</h2><div class="wigy-verified-clients-bar">' + verifiedBarSvg + (window.WIGY_CONFIG.rating && window.WIGY_CONFIG.rating.clientes ? ' +' + Number(window.WIGY_CONFIG.rating.clientes).toLocaleString("es-AR") + ' clientes verificados' : ' Clientes verificados') + '</div><div class="splide-wrapper"><button class="splide__arrow splide__arrow--prev" type="button">' + ARROW_SVG + '</button><button class="splide__arrow splide__arrow--next" type="button">' + ARROW_SVG + '</button><div class="splide__track"><ul class="splide__list">' + cardsHTML + '</ul></div><ul class="splide__pagination">' + dotsHTML + '</ul></div>';
  }

  function initTestimonialsSlider(wrapper) {
    var trackList = wrapper.querySelector('.splide__list');
    var slides = Array.from(wrapper.querySelectorAll('.splide__slide'));
    var prevBtn = wrapper.querySelector('.splide__arrow--prev');
    var nextBtn = wrapper.querySelector('.splide__arrow--next');
    var pagination = wrapper.querySelector('.splide__pagination');
    var dots = [];
    var currentIndex = 0;

    /* Un punto por POSICIÓN posible (no por tarjeta). Si todas las tarjetas
       entran en pantalla, se ocultan puntos y flechas. */
    function rebuildDots(positions) {
      if (!pagination || dots.length === positions) return;
      pagination.innerHTML = '';
      dots = [];
      for (var i = 0; i < positions; i++) {
        var li = document.createElement('li');
        var b = document.createElement('button');
        b.type = 'button';
        b.className = 'splide__pagination__page';
        b.setAttribute('aria-label', 'Ir a la posici\u00F3n ' + (i + 1));
        (function(idx) { b.addEventListener('click', function() { currentIndex = idx; updateSlider(); }); })(i);
        li.appendChild(b);
        pagination.appendChild(li);
        dots.push(b);
      }
    }

    function getSlidesPerView() { return window.innerWidth >= 768 ? 3 : 1; }

    function updateSlider() {
      var slidesPerView = getSlidesPerView();
      var maxIndex = Math.max(0, slides.length - slidesPerView);
      if (currentIndex > maxIndex) currentIndex = maxIndex;
      /* Desplazamiento en píxeles enteros: evita que las fotos se vean borrosas */
      var target = slides[currentIndex];
      var offset = target ? target.offsetLeft - slides[0].offsetLeft : 0;
      trackList.style.transform = 'translate3d(-' + Math.round(offset) + 'px,0,0)';
      rebuildDots(maxIndex + 1);
      dots.forEach(function(dot, i) { dot.classList.toggle('is-active', i === currentIndex); });
      var scrollable = maxIndex > 0;
      if (pagination) pagination.style.display = scrollable ? '' : 'none';
      if (prevBtn) { prevBtn.disabled = currentIndex === 0; prevBtn.style.visibility = scrollable ? '' : 'hidden'; }
      if (nextBtn) { nextBtn.disabled = currentIndex >= maxIndex; nextBtn.style.visibility = scrollable ? '' : 'hidden'; }
    }

    if (prevBtn) prevBtn.addEventListener('click', function() { if (currentIndex > 0) { currentIndex--; updateSlider(); } });
    if (nextBtn) nextBtn.addEventListener('click', function() {
      var maxIndex = Math.max(0, slides.length - getSlidesPerView());
      if (currentIndex < maxIndex) { currentIndex++; updateSlider(); }
    });

    var startX = 0;
    trackList.addEventListener('touchstart', function(e) { startX = e.touches[0].clientX; }, { passive: true });
    trackList.addEventListener('touchend', function(e) {
      var diff = e.changedTouches[0].clientX - startX;
      var maxIndex = Math.max(0, slides.length - getSlidesPerView());
      if (diff < -40 && currentIndex < maxIndex) currentIndex++;
      else if (diff > 40 && currentIndex > 0) currentIndex--;
      updateSlider();
    });

    window.addEventListener('resize', updateSlider);
    updateSlider();

    var observer = new IntersectionObserver(function(entries, obs) {
      if (entries[0].isIntersecting) {
        obs.unobserve(entries[0].target);
        slides.forEach(function(slide, index) {
          setTimeout(function() { slide.classList.add('is-visible-animated'); }, index * 150);
        });
      }
    }, { threshold: 0.15 });
    observer.observe(wrapper);
  }

  function mount() {
    if (document.getElementById(WRAPPER_ID)) return true;
    var comparisonWidget = document.getElementById("wigy-comparison-table-standalone");
    var statsWidget = document.getElementById("wigy-clinical-results-standalone");
    var target = comparisonWidget || statsWidget || document.getElementById("wigy-concerns-standalone");
    if (!target) return false;
    injectStyleOnce();
    var wrapper = document.createElement("section");
    wrapper.id = WRAPPER_ID;
    wrapper.innerHTML = buildHTML();
    target.insertAdjacentElement("afterend", wrapper);
    initTestimonialsSlider(wrapper);
    return true;
  }

  var tries = 0;
  var t = setInterval(function() { tries++; if (mount() || tries >= 80) clearInterval(t); }, 250);
})();

<!-- ================================================================
     BLOQUE 16B: PRUEBA SOCIAL — Resumen de reseñas + Fotos de clientes
     · Resumen (WIGY_CONFIG.resumenResenas): promedio, barras por estrella
       y "% lo recomienda". Arriba del slider de testimonios.
     · Fotos de clientes (WIGY_CONFIG.fotosClientes): muro de fotos,

<script>
(function() {
  if (window.WIGY_SLUG_BLOCK) return;

  var UGC_ID = "wigy-ugc-wall";

  function injectStyleOnce() {

      "#" + SUM_ID + "{max-width:760px;margin:0 auto 34px auto;padding:22px 24px;background:#fff;border:1px solid rgba(0,0,0,.07);border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.05);display:grid;grid-template-columns:auto 1fr;gap:28px;align-items:center;box-sizing:border-box;font-family:var(--vd-font-body)}" +
      "#" + SUM_ID + " .rs-score{text-align:center;min-width:150px}" +

      "#" + SUM_ID + " .rs-stars svg{width:18px;height:18px}" +

      "#" + SUM_ID + " .rs-n{text-align:right;color:#888}" +
      "#" + UGC_ID + "{max-width:1100px;margin:34px auto 0 auto;padding:0 15px;box-sizing:border-box;text-align:center}" +
      "#" + UGC_ID + " .ugc-title{font-family:var(--vd-font-title);font-size:20px;font-weight:700;color:#111;margin:0 0 4px}" +
      "#" + UGC_ID + " .ugc-sub{font-size:14px;color:#666;margin:0 0 16px}" +
      "#" + UGC_ID + " .ugc-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}" +
      "#" + UGC_ID + " .ugc-item{position:relative;aspect-ratio:1/1;border-radius:10px;overflow:hidden;background:#eee;margin:0}" +
      "#" + UGC_ID + " .ugc-item img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}" +

      "}";
    var st = document.createElement("style");

    st.textContent = css;
    document.head.appendChild(st);
  }

  var STAR = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87L18.18 22 12 18.27 5.82 22 7 14.14l-5-4.87 6.91-1.01z"/></svg>';

  function buildSummary(cfg) {
    var counts = (cfg.estrellas || []).slice(0, 5);
    while (counts.length < 5) counts.push(0);
    var total = counts.reduce(function(a, b) { return a + (+b || 0); }, 0);
    if (!total) return null;
    var avg = (counts[0] * 5 + counts[1] * 4 + counts[2] * 3 + counts[3] * 2 + counts[4]) / total;
    var el = document.createElement("div");
    el.id = SUM_ID;
    el.innerHTML =
      '<div class="rs-score"><div class="rs-num">' + avg.toFixed(1).replace(".", ",") + '</div>' +
        '<div class="rs-stars">' + STAR.repeat(5) + '</div>' +
        '<div class="rs-total">Basado en ' + total.toLocaleString("es-AR") + ' reseñas</div>' +
        (cfg.recomiendan ? '<div class="rs-rec">\u{1F44D} ' + cfg.recomiendan + '% lo recomienda</div>' : '') +
      '</div>' +
      '<div class="rs-rows">' + counts.map(function(c, i) {
        var pct = Math.round((+c || 0) * 100 / total);
        return '<div class="rs-row"><b>' + (5 - i) + ' ★</b><span class="rs-bar"><span class="rs-fill" data-w="' + pct + '%"></span></span><span class="rs-n">' + (+c || 0) + '</span></div>';
      }).join('') + '</div>';
    return el;
  }

  function buildUgc(fotos) {
    var ok = (fotos || []).filter(function(f) { return f && f.src && f.src.indexOf("⚠️") === -1; });
    if (!ok.length) return null;
    var el = document.createElement("div");
    el.id = UGC_ID;
    el.innerHTML = '<p class="ugc-title">Fotos de nuestros clientes</p><p class="ugc-sub">Compras reales, en casas reales \u{1F4F8}</p>' +
      '<div class="ugc-grid">' + ok.map(function(f) {
        return '<figure class="ugc-item"><img src="' + f.src + '" alt="Foto de ' + (f.nombre || 'cliente') + '" loading="lazy">' + (f.nombre ? '<figcaption>' + f.nombre + '</figcaption>' : '') + '</figure>';
      }).join('') + '</div>';
    return el;
  }

  function mount() {
    if (document.getElementById(SUM_ID) || document.getElementById(UGC_ID) || window.__wigySocialDone) return true;
    var wrap = document.getElementById("wigy-testimonials-slider-standalone");
    if (!wrap) return false;
    window.__wigySocialDone = true;
    var cfg = window.WIGY_CONFIG || {};
    injectStyleOnce();
    var sum = cfg.resumenResenas ? buildSummary(cfg.resumenResenas) : null;
    if (sum) {
      var slider = wrap.querySelector(".splide-wrapper");
      wrap.insertBefore(sum, slider || wrap.firstChild);
      var io = new IntersectionObserver(function(entries, o) {
        if (!entries[0].isIntersecting) return;
        o.disconnect();
        sum.querySelectorAll(".rs-fill").forEach(function(f) { f.style.width = f.getAttribute("data-w"); });
      }, { threshold: 0.3 });
      io.observe(sum);
    }
    var ugc = buildUgc(cfg.fotosClientes);
    if (ugc) wrap.appendChild(ugc);
    return true;
  }

  var tries = 0;
  var t = setInterval(function() { tries++; if (mount() || tries >= 120) clearInterval(t); }, 250);
})();
</script>

    "#" + ID + " .sticky-btn::after{content:'';position:absolute;top:-50%;left:-60%;",
    "width:40%;height:200%;background:linear-gradient(105deg,transparent 20%,",
    "rgba(255,255,255,0.15) 50%,transparent 80%);transform:skewX(-15deg);",
    "animation:wigy-sticky-shine 3s ease-in-out infinite}",

    "@keyframes wigy-sticky-shine{0%{left:-60%}40%{left:120%}100%{left:120%}}",

    "@media(max-width:768px){",
    "#" + ID + "{padding:10px 14px}",
    "#" + ID + " .sticky-inner{gap:12px}",
    "#" + ID + " .sticky-name{font-size:12px}",
    "#" + ID + " .sticky-price{font-size:16px}",
    "#" + ID + " .sticky-btn{padding:12px 20px;font-size:13px;letter-spacing:0.5px}}",

    "@media(max-width:380px){",
    "#" + ID + " .sticky-btn{padding:12px 16px;font-size:12px}}"
  ].join("");

  var st = document.createElement("style");
  st.id = ID + "-css";
  st.innerHTML = css;
  document.head.appendChild(st);

  function mount() {
    if (document.getElementById(ID)) return true;

    var realBtn = window.WIGY_DOM.btn();
    if (!realBtn) return false;

    var nameEl = window.WIGY_DOM.title();

    var productName = nameEl ? nameEl.textContent.trim() : "";

    /* Precio a mostrar: 1) pack elegido en nuestro selector, 2) pack elegido
       en Kaching Bundles, 3) precio nativo del producto. */
    function getPrices() {
      var selP = document.querySelector("#wigy-premium-bundles .kb-bar.sel .kb-p");
      if (selP) {
        var selO = document.querySelector("#wigy-premium-bundles .kb-bar.sel .kb-op");
        return { price: selP.textContent.trim(), old: selO ? selO.textContent.trim() : "" };
      }
      var root = document.querySelector("kaching-bundle, kaching-bundles-block, .kaching-bundles__block, .shopify-app-block[id*='kaching']");
      if (root) {
        var sel = root.querySelector("[class*='bar--selected'], [class*='bar'][class*='selected'], [class*='bar'][aria-checked='true']");
        if (!sel) {
          var radio = root.querySelector("input[type='radio']:checked");
          if (radio) sel = radio.closest("[class*='bar']") || radio.parentElement;
        }
        var amounts = sel ? ((sel.innerText || "").match(/\$\s?\d[\d.,]*/g) || []) : [];
        if (amounts.length) return { price: amounts[0], old: amounts[1] || "" };
      }
      var pEl = document.querySelector(".js-price-display") ||
                document.querySelector("[data-product-price]") ||
                document.querySelector(".product__info-container .price-item--sale, .product__info-container .price-item--regular");
      if (pEl) return { price: pEl.textContent.trim(), old: "" };
      try {
        var cents = window.ShopifyAnalytics.meta.product.variants[0].price;
        return { price: "$" + (cents / 100).toLocaleString("es-AR", { minimumFractionDigits: 2, maximumFractionDigits: 2 }), old: "" };
      } catch (e) {}
      return { price: "", old: "" };
    }
    var initial = getPrices();
    var priceText = initial.price;
    var oldPriceText = initial.old;

    var bar = document.createElement("div");
    bar.id = ID;
    bar.innerHTML =
      '<div class="sticky-inner">' +
        '<div class="sticky-info">' +
          (productName ? '<span class="sticky-name">' + productName + '</span>' : '') +
          '<div class="sticky-prices">' +
            '<span class="sticky-price">' + priceText + '</span>' +
            '<span class="sticky-old-price">' + oldPriceText + '</span>' +
          '</div>' +
        '</div>' +
        '<button class="sticky-btn" type="button">Agregar al carrito</button>' +
      '</div>';

    document.body.appendChild(bar);

    /* Cuando la barra fija está visible, el aviso de compras sube por encima */
    function setVis(on) {
      bar.classList.toggle("visible", on);
      document.documentElement.style.setProperty("--wigy-sticky-h", bar.offsetHeight + "px");
      document.body.classList.toggle("wigy-sticky-on", on);
    }

    var dismissed = false;
    bar.querySelector(".sticky-btn").addEventListener("click", function() {
      var btn = window.WIGY_DOM.btn();
      if (btn) btn.click();

      dismissed = true;
      setVis(false);
      bar.classList.add("dismiss");

      setTimeout(function() {
        bar.remove();
      }, 500);
    });

    /* Al elegir otro pack (nuestro o de Kaching), se actualiza el precio */
    function refreshPrices() {
      var pr = getPrices();
      if (pr.price) bar.querySelector(".sticky-price").textContent = pr.price;
      bar.querySelector(".sticky-old-price").textContent = pr.old;
    }
    document.addEventListener("click", function() { setTimeout(refreshPrices, 150); }, true);
    document.addEventListener("change", function() { setTimeout(refreshPrices, 150); }, true);
    setTimeout(refreshPrices, 1500);

    /* Visible cuando el botón original quedó por ENCIMA de la pantalla.
       Se chequea en cada scroll (no solo al cruzar el botón), así funciona
       también con scroll rápido o saltos directos a una sección. */
    var raf = null;
    function check() {
      raf = null;
      if (dismissed) return;
      var shouldShow = realBtn.getBoundingClientRect().bottom < 0;
      if (shouldShow !== bar.classList.contains("visible")) setVis(shouldShow);
    }
    function onScroll() { if (!raf) raf = requestAnimationFrame(check); }
    window.addEventListener("scroll", onScroll, { passive: true });
    window.addEventListener("resize", onScroll, { passive: true });
    check();
    return true;
  }

  var tries = 0;
  var t = setInterval(function() {
    tries++;
    if (mount() || tries >= 80) clearInterval(t);
  }, 250);
})();
</script>

    "hace 15 min", "hace 18 min", "hace 23 min", "hace 28 min"

  function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

  var css = [

    "color:#2F2A26;font-size:11px;font-weight:700}",

    "#" + ID + " .toast-verified svg{width:12px;height:12px}",

    "@media(max-width:768px){",
    "#" + ID + "{bottom:14px;left:14px;max-width:290px;width:calc(100% - 28px);",
    "padding:12px 14px;gap:10px}",
    "#" + ID + " .toast-avatar{width:40px;height:40px}",
    "#" + ID + " .toast-avatar span{font-size:16px}",
    "#" + ID + " .toast-name{font-size:13px}",
    "#" + ID + " .toast-action{font-size:12px}}",

    "@media(min-width:769px){",
    "#" + ID + "{left:32px;bottom:28px;max-width:340px;width:340px}}",

    "body.wigy-sticky-on #" + ID + "{bottom:calc(var(--wigy-sticky-h,72px) + 12px)!important}"
  ].join("");

  var st = document.createElement("style");
  st.id = ID + "-css";
  st.innerHTML = css;
  document.head.appendChild(st);

  var toast = document.createElement("div");
  toast.id = ID;
  document.body.appendChild(toast);

  var checkSvg = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>';

  function getProductName() {
    var cfgName = window.WIGY_CONFIG && window.WIGY_CONFIG.nombreToast;
    if (cfgName) return cfgName;
    var el = window.WIGY_DOM.title();
    if (el) {
      var text = el.textContent.trim();
      return text.length > 30 ? text.substring(0, 30) + "…" : text;
    }
    return (window.WIGY_CONFIG && window.WIGY_CONFIG.nombreProducto) || "este producto";
  }

  var toastCount = 0;

  function showToast() {
    var buyer = pick(BUYERS);
    var time = pick(TIMES);
    var productName = getProductName();

    var avatarHTML;
    if (buyer.img && buyer.img.length > 0 && buyer.img.indexOf("\u26A0\uFE0F") === -1) {
      avatarHTML = '<div class="toast-avatar"><img src="' + buyer.img + '" alt="' + buyer.name + '"></div>';

      avatarHTML = '<div class="toast-avatar"><span>' + buyer.name.charAt(0).toUpperCase() + '</span></div>';

      toast.classList.remove("toast-in");
      toast.classList.add("toast-out");
    }, currentDuration);
  }

  function scheduleNext() {
    var currentDuration = BASE_SHOW_DURATION + (toastCount * EXTRA_PER_TOAST);
    setTimeout(function() {
      showToast();
      scheduleNext();
    }, currentDuration + PAUSE_BETWEEN);
  }

  setTimeout(function() {
    showToast();
    scheduleNext();
  }, INITIAL_DELAY);

})();
</script>

<!-- ================================================================
     BLOQUE: PACK PRESELECCIONADO DESDE EL INICIO (?pack=2 / ?pack=3)
     Si el cliente llega desde el inicio con un pack elegido, se marca
     ese pack en Kaching automáticamente.
     ================================================================ -->
<script>
(function() {
  if (window.WIGY_SLUG_BLOCK) return;
  var m = location.search.match(/[?&]pack=(\d)/);
  if (!m) return;
  var idx = parseInt(m[1], 10) - 1;
  if (idx < 0) return;

  /* Busca las opciones de Kaching (también dentro de shadow DOM) */
  function getBars() {
    var hosts = document.querySelectorAll("kaching-bundle, kaching-bundles-block, .kaching-bundles__block, .kaching-bundles, [id*='kaching']");
    for (var h = 0; h < hosts.length; h++) {
      var scope = hosts[h].shadowRoot || hosts[h];
      var bars = scope.querySelectorAll(".kaching-bundles__bar");
      if (!bars.length) bars = scope.querySelectorAll("[class*='bundles__bar']:not([class*='bundles__bar-']):not([class*='bundles__bars'])");
      if (!bars.length) {
        var radios = scope.querySelectorAll("input[type='radio']");
        if (radios.length) bars = Array.prototype.map.call(radios, function(r) { return r.closest("label") || r.parentElement; });
      }
      if (bars.length) return bars;
    }
    return [];
  }
  function isSelected(bar) {
    var r = bar.querySelector && bar.querySelector("input[type='radio']");
    if (r) return r.checked;
    return /selected|active|checked/.test(bar.className || "") || bar.getAttribute("aria-checked") === "true";
  }
  function selectBar(bar) {
    var r = bar.querySelector("input[type='radio']");
    bar.click();
    if (r && !r.checked) { r.click(); }
    if (r && !r.checked) {
      r.checked = true;
      r.dispatchEvent(new Event("input", { bubbles: true }));
      r.dispatchEvent(new Event("change", { bubbles: true }));
    }
  }

  /* Kaching puede cargar tarde o volver a marcar su opción por defecto,
     así que se insiste hasta que el pack elegido quede marcado y estable. */
  var tries = 0, stable = 0;
  var timer = setInterval(function() {
    tries++;
    var bars = getBars();
    if (bars.length > idx) {
      if (isSelected(bars[idx])) {
        stable++;
        if (stable >= 8) clearInterval(timer);
      } else {
        stable = 0;
        selectBar(bars[idx]);
      }
    }
    if (tries > 75) clearInterval(timer);
  }, 200);
})();
</script>
</div>
