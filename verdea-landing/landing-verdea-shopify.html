<script>
window.WIGY_DOM = {
  form: function() {
    return document.querySelector(".js-product-form") ||
           document.getElementById("product_form") ||
           document.querySelector("product-form form[action*='/cart/add']") ||
           document.querySelector("form[id^='product-form-template']") ||
           document.querySelector("form.product-form[action*='/cart/add']") ||
           document.querySelector("form[action*='/cart/add']:not(.installment)");
  },
  btn: function() {
    var f = this.form();
    return document.querySelector(".js-prod-submit-form") ||
           (f && f.querySelector(".product-form__submit, button[name='add'], [type='submit']")) ||
           document.querySelector("button[name='add']");
  },
  title: function() {
    return document.querySelector(".js-product-name") ||
           document.querySelector("[data-store='product-name']") ||
           document.querySelector(".product__title h1") ||
           document.querySelector(".product__title") ||
           document.querySelector("h1");
  },
  qty: function() {
    return document.querySelector(".js-quantity-input") ||
           document.querySelector(".product-form__quantity input[name='quantity']") ||
           document.querySelector("input[name='quantity']");
  },
  /* Contenedor de ANCHO COMPLETO para las secciones largas de la landing.
     Se crea justo DEBAJO de la sección del producto (foto + columna de compra),
     así las secciones ocupan todo el ancho en PC en lugar de la columna derecha. */
  fullWidth: function() {
    var c = document.getElementById("wigy-landing-full");
    if (c) return c;
    var f = this.form();
    if (!f) return null;
    var host = document.getElementById("wigy-preview-page") ||
               f.closest(".shopify-section") ||
               f.closest("section") ||
               f.closest(".product, product-info");
    c = document.createElement("div");
    c.id = "wigy-landing-full";
    if (host && host.parentNode) host.insertAdjacentElement("afterend", c);
    else f.appendChild(c);
    return c;
  }
};
</script>

<!-- ================================================================
     VALIDACIÓN DE SLUG + MODO PRUEBA
     · En Shopify: solo carga en la URL del producto (compara por handle
       /products/xxx, funciona desde /collections/... y con ?variant=...).
     · MODO PRUEBA (sin validación de URL): se activa solo cuando el archivo
       se abre localmente (file://), en localhost/127.0.0.1, con ?wigy_preview=1
       en la URL, o con modoPrueba: true en el panel. Si la página no tiene
       formulario de producto, crea uno simulado para ver la landing completa.
     ================================================================ -->
<script>
(function() {
  var cfg = window.WIGY_CONFIG || {};
  var loc = window.location;
  var isLocal = loc.protocol === "file:" ||
                /^(localhost|127\.0\.0\.1|0\.0\.0\.0|\[::1\])$/.test(loc.hostname);
  var forced = cfg.modoPrueba === true || /[?&]wigy_preview=1\b/.test(loc.search);
  window.WIGY_PREVIEW = isLocal || forced;

  if (!window.WIGY_PREVIEW) {
    var slugURL = cfg.slugURL;
    if (!slugURL || slugURL.indexOf("⚠️") !== -1) return;
    try {
      var configPath = new URL(slugURL).pathname.replace(/\/+$/, "");
      var currentPath = loc.pathname.replace(/\/+$/, "");
      var m = configPath.match(/\/products\/[^\/]+$/);
      var ok = m ? (currentPath.slice(-m[0].length) === m[0]) : (currentPath === configPath);
      if (!ok) window.WIGY_SLUG_BLOCK = true;
    } catch(e) {
      window.WIGY_SLUG_BLOCK = true;
    }
    return;
  }

  /* ---------- MODO PRUEBA: página de producto simulada ---------- */
  window.WIGY_SLUG_BLOCK = false;
  function buildMock() {
    if (document.getElementById("wigy-preview-page") || window.WIGY_DOM.form()) return;
    if (!document.body) return;
    var st = document.createElement("style");
    st.id = "wigy-preview-style";
    st.textContent =
      "body{margin:0;background:#fff;color:#1f1f1f;font-family:'Open Sans','Lato',sans-serif}" +
      "#wigy-preview-banner{background:#E88031;color:#fff;text-align:center;font:600 12px/1.4 'Open Sans',sans-serif;padding:6px 12px}" +
      "#wigy-preview-page{max-width:1200px;margin:0 auto;padding:24px 16px 40px;box-sizing:border-box}" +
      "#wigy-preview-page .wp-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:48px;align-items:start}" +

<!-- ================================================================
     BLOQUE PRECARGA: Carga anticipada de TODAS las imágenes
     ================================================================ -->
<script>
(function() {
  if (window.WIGY_SLUG_BLOCK) return;
  var cfg = window.WIGY_CONFIG;
  if (!cfg) return;

  /* Imágenes CRÍTICAS — preload con <link> en el <head> (máxima prioridad del navegador) */
  var critical = [];
  if (cfg.comparadorAntes) critical.push(cfg.comparadorAntes);
  if (cfg.comparadorDespues) critical.push(cfg.comparadorDespues);
  if (cfg.fotoEstadisticas) critical.push(cfg.fotoEstadisticas);
  if (cfg.experto && cfg.experto.foto) critical.push(cfg.experto.foto);
  critical.forEach(function(url) {
    if (!url || url.indexOf("\u26A0\uFE0F") !== -1) return;
    var link = document.createElement("link");
    link.rel = "preload";
    link.as = "image";
    link.href = url;
    document.head.appendChild(link);
  });

  /* Resto de imágenes — preload con new Image() */
  var urls = [];
  if (cfg.carruselImagenes && cfg.mostrarCarrusel !== false) cfg.carruselImagenes.forEach(function(item) { urls.push(item.src); });
  if (cfg.testimonios) cfg.testimonios.forEach(function(t) { if (t.foto) urls.push(t.foto); });
  if (cfg.logosMediaTicker) cfg.logosMediaTicker.forEach(function(l) { urls.push(l.src); });
  urls.forEach(function(url) {
    if (!url || url.indexOf("\u26A0\uFE0F") !== -1) return;
    var img = new Image();
    img.src = url;
  });
})();
</script>
<!-- ================================================================
     BLOQUE 0A: RATING GENERAL (ESTRELLAS + CALIFICACIONES)
     ================================================================ -->
<script>
(function() {
  if (window.WIGY_SLUG_BLOCK) return;
  var ID = "wigy-product-rating";
  var STYLE_ID = ID + "-style";

  function injectStyleOnce() {
    if (document.getElementById(STYLE_ID)) return;
    var css =
      "#" + ID + "{display:flex;align-items:center;gap:8px;margin:4px 0 10px 0;font-family:inherit}" +
      "#" + ID + " .wr-stars{display:flex;align-items:center;gap:1px}" +
      "#" + ID + " .wr-stars svg{width:16px;height:16px}" +
      "#" + ID + " .wr-score{font-size:14px;font-weight:700;color:#2A5F35;line-height:1}" +
      "#" + ID + " .wr-count{font-size:13px;font-weight:500;color:#666;line-height:1}" +
      "#" + ID + " .wr-count span{text-decoration:underline;cursor:pointer}" +
      "@media(max-width:768px){#" + ID + " .wr-stars svg{width:14px;height:14px}#" + ID + " .wr-score{font-size:13px}#" + ID + " .wr-count{font-size:12px}}";
    var st = document.createElement("style");
    st.id = STYLE_ID;
    st.innerHTML = css;
    document.head.appendChild(st);
  }

  function buildStars(rating) {
    var full = Math.floor(rating);
    var hasHalf = (rating - full) >= 0.3;
    var starFull = '<svg viewBox="0 0 24 24" fill="#6BA342" stroke="none"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87L18.18 22 12 18.27 5.82 22 7 14.14l-5-4.87 6.91-1.01z"/></svg>';
    var starHalf = '<svg viewBox="0 0 24 24" fill="none" stroke="none"><defs><linearGradient id="wrh"><stop offset="50%" stop-color="#6BA342"/><stop offset="50%" stop-color="#E0E0E0"/></linearGradient></defs><path d="M12 2l3.09 6.26L22 9.27l-5 4.87L18.18 22 12 18.27 5.82 22 7 14.14l-5-4.87 6.91-1.01z" fill="url(#wrh)"/></svg>';
    var starEmpty = '<svg viewBox="0 0 24 24" fill="#E0E0E0" stroke="none"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87L18.18 22 12 18.27 5.82 22 7 14.14l-5-4.87 6.91-1.01z"/></svg>';
    var html = '';
    for (var i = 0; i < full; i++) html += starFull;
    if (hasHalf) { html += starHalf; full++; }
    for (var j = full; j < 5; j++) html += starEmpty;
    return html;
  }

  function mount() {
    if (document.getElementById(ID)) return;
    var cfg = window.WIGY_CONFIG && window.WIGY_CONFIG.rating;
    if (!cfg) return;
    var titleEl = window.WIGY_DOM.title();
    if (!titleEl) return;
    injectStyleOnce();
    var el = document.createElement("div");
    el.id = ID;
    el.innerHTML =
      '<div class="wr-stars">' + buildStars(cfg.puntuacion) + '</div>' +
      '<span class="wr-score">' + cfg.puntuacion.toFixed(1) + '</span>' +
      '<span class="wr-count"><span>' + cfg.cantidadOpiniones + ' opiniones de clientes</span></span>';
    titleEl.insertAdjacentElement("afterend", el);
  }

  var tries = 0;
  var t = setInterval(function() {
    tries++;
    mount();
    if (document.getElementById(ID) || tries >= 60) clearInterval(t);
  }, 250);
})();
</script>

ize:18px;font-weight:800;color:#111;display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin:0}.kb-p{font-size:20px;font-weight:900;color:#111;margin:0;white-space:nowrap;flex-shrink:0}.kb-s{font-size:15px;color:#555;font-weight:600;margin:0}.kb-op{font-size:15px;color:#888;text-decoration:line-through;margin:0}.kb-gifts{padding:0;overflow:hidden}.kb-gift-row{display:flex;align-items:center;gap:10px;padding:10px 20px;font-size:13px;font-weight:700;color:#333;background:rgba(107,163,66,.08);border-top:1px solid rgba(42,95,53,.1)}.kb-gift-row:last-child{border-radius:0 0 14px 14px}.kb-gift-check{width:20px;height:20px;border-radius:6px;background:#2A5F35;color:#fff;display:flex;align-items:center;justify-content:center;flex:0 0 auto}.kb-gift-check svg{width:12px;height:12px}.kb-gift-tag{background:#2A5F35;color:#fff;font-size:11px;font-weight:800;padding:3px 9px;border-radius:99px;margin-left:auto;white-space:nowrap}.js-quantity,.js-product-quantity,[data-component='product.quantity'],.product__info-container .product-form__quantity{display:none!important}.wigy-atc-col,.product-form__buttons{width:100%!important;max-width:600px!important;margin-left:auto!important;margin-right:auto!important;float:none!important;align-self:center!important;box-sizing:border-box!important}.js-prod-submit-form,button[name='add'],.btn-add-to-cart,.product-form__submit{background:linear-gradient(135deg,#2A5F35 0%,#6BA342 100%)!important;color:#ffffff!important;border:none!important;border-radius:99px!important;font-family:'Poppins','Montserrat',sans-serif!important;font-size:20px!important;font-weight:900!important;text-transform:uppercase!important;letter-spacing:1px!important;padding:20px 24px!important;box-shadow:0 8px 24px rgba(42,95,53,0.3)!important;transition:transform 0.2s ease,background 0.3s ease!important;width:100%!important;max-width:600px!important;margin:0 auto 15px auto!important;display:flex!important;align-items:center!important;justify-content:center!important;text-align:center!important;box-sizing:border-box!important;min-height:0!important}.js-prod-submit-form:hover,button[name='add']:hover,.btn-add-to-cart:hover,.product-form__submit:hover{transform:translateY(-3px)!important;background:linear-gradient(135deg,#1F4727 0%,#2A5F35 100%)!important}@keyframes kbSlideIn{0%{opacity:0;transform:translateY(20px) scale(0.95)}60%{opacity:1;transform:translateY(-3px) scale(1.02)}100%{opacity:1;transform:translateY(0) scale(1)}}@keyframes kbPopBounce{0%{opacity:0;transform:scale(0.2) rotate(-5deg)}50%{opacity:1;transform:scale(1.35) rotate(4deg)}75%{opacity:1;transform:scale(0.9) rotate(-2deg)}100%{opacity:1;transform:scale(1) rotate(0deg)}}.kb-in-view .kb-title{animation:kbSlideIn 0.6s cubic-bezier(0.175,0.885,0.32,1.275) forwards}.kb-in-view .kb-pop{animation:kbPopBounce 0.7s cubic-bezier(0.175,0.885,0.32,1.275) forwards}.kb-in-view .kb-bdg{animation:kbPopBounce 0.7s cubic-bezier(0.175,0.885,0.32,1.275) forwards}.kb-in-view .kb-bar:nth-child(3) .kb-pop{animation-delay:0.15s}.kb-in-view .kb-bar:nth-child(4) .kb-pop{animation-delay:0.35s}.kb-in-view .kb-bar:nth-child(3) .kb-bdg{animation-delay:0.25s}.kb-in-view .kb-bar:nth-child(4) .kb-bdg{animation-delay:0.45s}@media(max-width:768px){.kb-t{font-size:16px}.kb-p{font-size:18px}.js-prod-submit-form,button[name='add'],.btn-add-to-cart,.product-form__submit{font-size:18px!important;padding:18px 20px!important}}@media(max-width:480px){.kb-title{white-space:normal;text-align:center;font-size:15px}}";

    pCol.style.setProperty('width', '100%', 'important');
    pCol.style.setProperty('max-width', '600px', 'important');

    var viewTimer;
    var observer = new IntersectionObserver(function(entries, obs) {
      entries.forEach(function(entry) {
        if (entry.isIntersecting) {
          viewTimer = setTimeout(function() { w.classList.add('kb-in-view'); obs.unobserve(w); }, 300);

          clearTimeout(viewTimer);

      });

        w.querySelectorAll('.kb-bar').forEach(function(i) { i.classList.remove('sel'); });

          while (c > qt) { bM.click(); c--; }
        }

  function createBox() {
    var box = document.createElement("div");
    box.id = BOX_ID;
    box.innerHTML =
      '<div class="wigy-garantia-content">' +
        '<div class="wigy-garantia-shine" aria-hidden="true"></div>' +
        '<svg class="wigy-garantia-icon" viewBox="0 0 24 24" aria-hidden="true">' +
          '<path fill="currentColor" d="M12 2l8 4v6c0 5-3.4 9.4-8 10-4.6-.6-8-5-8-10V6l8-4zm-1 14l6-6-1.4-1.4L11 13.2 8.4 10.6 7 12l4 4z"/>' +
        '</svg>' +
        '<div class="wigy-garantia-text">' +
          '<p class="wigy-garantia-title">' + (function(){var d=(window.WIGY_CONFIG&&window.WIGY_CONFIG.garantiaDias)||0;return d?'Garant\u00EDa de '+d+' d\u00EDas':'Garant\u00EDa 100%';})() + ' \u00B7 Compra protegida</p>' +

        '</div>' +

  }

  function attachShineObserver(box) {
    if (!window.IntersectionObserver) {
      setTimeout(function() { box.classList.add("wigy-animate"); }, 700);
      return;
    }
    var io = new IntersectionObserver(function(entries, obs) {
      entries.forEach(function(entry) {
        if (entry.isIntersecting) {
          box.classList.add("wigy-animate");
          obs.unobserve(box);
        }
      });
    }, { threshold: 0.5 });
    io.observe(box);
  }

  function mount() {
    if (document.getElementById(BOX_ID)) return;
    var form = window.WIGY_DOM.form();
    if (!form) return;

    var box = createBox();

    } else {
      form.appendChild(box);
    }
    attachShineObserver(box);
  }

  mount();
  var tries = 0;
  var t = setInterval(function() {
    tries++;
    mount();
    if (document.getElementById(BOX_ID) || tries >= 80) clearInterval(t);
  }, 250);
})();
</script>

(function() {
  if (window.WIGY_SLUG_BLOCK) return;
  var ID = "wigy-media-ticker";
  var STYLE_ID = ID + "-style";

  function injectStyleOnce() {
    if (document.getElementById(STYLE_ID)) return;
    var css = [
      "#" + ID + "{width:100%;max-width:1200px;margin:0 auto;padding:30px 0 40px 0;overflow:hidden;position:relative}",

      "#" + ID + " .media-ticker-label{text-align:center;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:1.5px;color:#4E382A;opacity:.7;margin-bottom:18px}",

      "#" + ID + " .media-ticker-track-wrap{overflow:hidden;width:100%;",
      "mask-image:linear-gradient(to right,transparent 0%,black 8%,black 92%,transparent 100%);",
      "-webkit-mask-image:linear-gradient(to right,transparent 0%,black 8%,black 92%,transparent 100%)}",

      "#" + ID + " .media-ticker-track{display:flex;align-items:center;gap:60px;width:max-content;",
      "animation:wigy-media-scroll 20s linear infinite;animation-play-state:paused}",

      "#" + ID + " .media-ticker-track.running{animation-play-state:running}",

      "#" + ID + " .media-ticker-track img{height:28px;width:auto;object-fit:contain;",
      "filter:grayscale(100%) opacity(0.5);transition:filter 0.3s ease;flex:0 0 auto}",

      "#" + ID + " .media-ticker-track img:hover{filter:grayscale(0%) opacity(1)}",

      "@keyframes wigy-media-scroll{to{transform:translateX(calc(-50% - 30px))}}",

      "@media(max-width:768px){",
      "#" + ID + "{padding:20px 0 30px 0}",
      "#" + ID + " .media-ticker-track{gap:40px;animation-duration:15s}",
      "#" + ID + " .media-ticker-track img{height:22px}",
      "#" + ID + " .media-ticker-label{font-size:11px;letter-spacing:1.2px}}"
    ].join("");
    var st = document.createElement("style");
    st.id = STYLE_ID;
    st.innerHTML = css;
    document.head.appendChild(st);
  }

  function mount() {
    if (document.getElementById(ID)) return true;
    var faqsBlock = document.getElementById("wigy-shopify-faqs-accordion");
    if (!faqsBlock) return false;
    var logos = window.WIGY_CONFIG && window.WIGY_CONFIG.logosMediaTicker;
    if (!logos || !logos.length) return false;

    injectStyleOnce();

    var REPEATS = 8;
    var imgsHTML = "";
    for (var r = 0; r < REPEATS; r++) {
      for (var i = 0; i < logos.length; i++) {
        imgsHTML += '<img src="' + logos[i].src + '" alt="' + (logos[i].alt || '') + '" draggable="false">';
      }
    }

    wrapper.id = ID;

      '<div class="media-ticker-track-wrap"><div class="media-ticker-track">' + imgsHTML + '</div></div>';

    faqsBlock.insertAdjacentElement("afterend", wrapper);

    /* Esperar a que las primeras N imágenes carguen antes de animar */
    var track = wrapper.querySelector(".media-ticker-track");
    var uniqueCount = logos.length;
    var loaded = 0;
    var firstBatch = track.querySelectorAll("img");
    function checkReady() {
      loaded++;
      if (loaded >= uniqueCount) track.classList.add("running");
    }
    for (var j = 0; j < Math.min(uniqueCount, firstBatch.length); j++) {
      if (firstBatch[j].complete) { checkReady(); }
      else { firstBatch[j].onload = firstBatch[j].onerror = checkReady; }
    }
    /* Fallback: forzar arranque a los 3 segundos */
    setTimeout(function() { track.classList.add("running"); }, 3000);

    return true;
  }

  var tries = 0;
  var t = setInterval(function() {
    tries++;
    if (mount() || tries >= 120) clearInterval(t);
  }, 200);
})();
</script>

  function initTimelineScroll(wrapper) {
    var track = wrapper.querySelector('.timeline-track');
    var fillLine = wrapper.querySelector('.timeline-progress-fill');
    if (!track || !fillLine) return;
    var pills = Array.prototype.slice.call(wrapper.querySelectorAll('.t-pill-orange'));

    var maxFill = 0;

    function triggerPop(pill) {
      pill.classList.remove('pop'); void pill.offsetWidth; pill.classList.add('pop');
      pill.addEventListener('animationend', function() { pill.classList.remove('pop'); }, { once: true });
    }

    function update() {
      rafId = null;
      var rect = track.getBoundingClientRect();
      var triggerPt = window.innerHeight * 0.65;
      var pct = Math.max(0, Math.min(1, (triggerPt - rect.top) / rect.height));

        maxFill = pct;
        fillLine.style.transform = 'scaleY(' + maxFill + ')';

          var center = pr.top + pr.height / 2 - rect.top;
          if (maxFill >= center / rect.height) { popped[i] = true; triggerPop(pill); }
        });
      }
    }

  function animateRings(wrapper) {
    var rings = wrapper.querySelectorAll(".results__percentage");
    var DURATION = 1800;
    var STAGGER = 200;

    rings.forEach(function(ring, index) {
      var target = parseInt(ring.getAttribute("data-target"));
      var numEl = ring.querySelector("p");
      var startTime = null;
      var delay = index * STAGGER;

      setTimeout(function() {
        function tick(timestamp) {
          if (!startTime) startTime = timestamp;
          var elapsed = timestamp - startTime;
          var progress = Math.min(elapsed / DURATION, 1);
          var eased = 1 - Math.pow(1 - progress, 3);
          var currentVal = Math.round(eased * target);
          var currentDeg = (eased * target / 100) * 360;
          numEl.textContent = currentVal + "%";
          ring.style.background = "conic-gradient(#6BA342 " + currentDeg + "deg, #f1f5f9 " + currentDeg + "deg 360deg)";
          if (progress < 1) requestAnimationFrame(tick);
        }
        requestAnimationFrame(tick);
      }, delay);
    });
  }

  function mount() {
    if (document.getElementById(WRAPPER_ID)) return true;

        animateRings(wrapper);

    obs.observe(wrapper);

    return true;
  }

  var tries = 0;
  var t = setInterval(function() { tries++; if (mount() || tries >= 80) clearInterval(t); }, 250);
})();
</script>

  }

  function positionOverlay(wrapper) {
    var thBrand = wrapper.querySelector(".th-brand");
    var lastBrand = wrapper.querySelectorAll(".cell-brand");
    var lastCell = lastBrand[lastBrand.length - 1];
    var tableWrapper = wrapper.querySelector(".comp-table-wrapper");
    var overlay = wrapper.querySelector(".comp-brand-bg");
    if (!thBrand || !lastCell || !tableWrapper || !overlay) return;
    var wrapperRect = tableWrapper.getBoundingClientRect();
    var thRect = thBrand.getBoundingClientRect();
    var lastRect = lastCell.getBoundingClientRect();
    overlay.style.top = (thRect.top - wrapperRect.top) + "px";
    overlay.style.left = (thRect.left - wrapperRect.left) + "px";
    overlay.style.width = thRect.width + "px";
    overlay.style.height = (lastRect.bottom - thRect.top) + "px";
  }

  function mount() {
    if (document.getElementById(WRAPPER_ID)) return true;
    var statsWidget = document.getElementById("wigy-clinical-results-standalone") || document.getElementById("wigy-concerns-standalone");

    setTimeout(function() { positionOverlay(wrapper); }, 100);
    window.addEventListener("resize", function() { positionOverlay(wrapper); });

    var animated = false;
    var obs = new IntersectionObserver(function(entries, o) {
      if (entries[0].isIntersecting && !animated) {
        animated = true;
        o.unobserve(wrapper);
        positionOverlay(wrapper);
        setTimeout(function() {
          wrapper.classList.add("wigy-revealed");
        }, 800);
      }
    }, { threshold: 0.2 });
    obs.observe(wrapper);

    return true;
  }

  var tries = 0;
  var t = setInterval(function() { tries++; if (mount() || tries >= 80) clearInterval(t); }, 250);
})();
</script>

imonial-verified{display:inline-flex;align-items:center;gap:4px;margin-top:8px;font-size:12px;font-weight:700;color:#2A5F35;line-height:1}\n#" + WRAPPER_ID + " .testimonial-verified svg{width:14px;height:14px;flex:0 0 auto}\n#" + WRAPPER_ID + " .wigy-verified-clients-bar{display:flex;align-items:center;justify-content:center;gap:6px;margin-bottom:12px;font-size:13px;font-weight:700;color:#2A5F35;letter-spacing:0.3px}\n#" + WRAPPER_ID + " .wigy-verified-clients-bar svg{width:16px;height:16px;flex:0 0 auto}\n@media(max-width:768px){#" + WRAPPER_ID + "{margin:30px auto 40px auto}#" + WRAPPER_ID + " .title-with-highlight{font-size:28px;margin-bottom:25px}#" + WRAPPER_ID + " .splide-wrapper{padding:0 15px}#" + WRAPPER_ID + " .splide__arrow{width:40px;height:40px}#" + WRAPPER_ID + " .splide__arrow--prev{left:-5px}#" + WRAPPER_ID + " .splide__arrow--next{right:-5px}#" + WRAPPER_ID + " h3{font-size:18px}#" + WRAPPER_ID + " .rte p{font-size:14.5px}}";
    var st = document.createElement("style");
    st.id = WRAPPER_ID + "-style";
    st.innerHTML = css;
    document.head.appendChild(st);
  }

  var STAR_SVG = '<svg viewBox="0 0 576 512" fill="currentColor"><path d="M316.9 18C311.6 7 300.4 0 288.1 0s-23.4 7-28.8 18L195 150.3 51.4 171.5c-12 1.8-22 10.2-25.7 21.7s-.7 24.2 7.9 32.7L137.8 329 113.2 474.7c-2 12 3 24.2 12.9 31.3s23 8 33.8 2.3l128.3-68.5 128.3 68.5c10.8 5.7 23.9 4.9 33.8-2.3s14.9-19.3 12.9-31.3L438.5 329 542.7 225.9c8.6-8.5 11.7-21.2 7.9-32.7s-13.7-19.9-25.7-21.7L381.2 150.3 316.9 18z"></path></svg>';
  var STARS_5 = '<div class="rating-stars-and-text"><div class="rating-stars__container">' + STAR_SVG.repeat(5) + '</div></div>';
  var ARROW_SVG = '<svg viewBox="0 0 40 40"><path d="m15.5 0.932-4.3 4.38 14.5 14.6-14.5 14.5 4.3 4.4 14.6-14.6 4.4-4.3-4.4-4.4-14.6-14.6z"></path></svg>';

  var VERIFIED_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>';

  function buildHTML() {
    var cfgTest = window.WIGY_CONFIG.testimonios;
    var cards = cfgTest.map(function(t) {
      return { img: t.foto, alt: t.nombre, title: t.titulo, text: t.texto, author: t.nombre };
    });

    var cardsHTML = cards.map(function(c) {
      var hasImg = c.img && c.img.indexOf('\u26A0\uFE0F') === -1;
      var media = hasImg
        ? '<img src="' + c.img + '" alt="' + c.alt + '" loading="eager" class="multicolumn-card__image">'
        : '<div class="multicolumn-card__image" style="display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#2A5F35,#6BA342);color:#fff;font-size:72px;font-weight:700;font-family:var(--vd-font-title)">' + (c.author || '?').charAt(0).toUpperCase() + '</div>';
      return '<li class="splide__slide"><div class="multicolumn-card"><div class="multicolumn-card__image-wrapper">' + media + '</div><div class="multicolumn-card__info">' + STARS_5 + '<h3>' + c.title + '</h3><div class="rte"><p>' + c.text + '</p></div><p class="testimonial-card__author">' + c.author + '</p><span class="testimonial-verified">' + VERIFIED_SVG + ' Compra verificada</span></div></div></li>';
    }).join('');

    var dotsHTML = cards.map(function(_, i) {
      return '<li><button class="splide__pagination__page' + (i === 0 ? ' is-active' : '') + '" type="button"></button></li>';
    }).join('');

    var verifiedBarSvg = '<svg viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm-1.09 14.41l-3.5-3.5 1.41-1.41 2.09 2.09 5.18-5.18 1.41 1.41-6.59 6.59z"/></svg>';

  }

  function initTestimonialsSlider(wrapper) {
    var trackList = wrapper.querySelector('.splide__list');
    var slides = Array.from(wrapper.querySelectorAll('.splide__slide'));
    var prevBtn = wrapper.querySelector('.splide__arrow--prev');
    var nextBtn = wrapper.querySelector('.splide__arrow--next');
    var pagination = wrapper.querySelector('.splide__pagination');
    var dots = [];
    var currentIndex = 0;

    /* Un punto por POSICIÓN posible (no por tarjeta). Si todas las tarjetas
       entran en pantalla, se ocultan puntos y flechas. */
    function rebuildDots(positions) {
      if (!pagination || dots.length === positions) return;
      pagination.innerHTML = '';
      dots = [];
      for (var i = 0; i < positions; i++) {
        var li = document.createElement('li');
        var b = document.createElement('button');
        b.type = 'button';
        b.className = 'splide__pagination__page';
        b.setAttribute('aria-label', 'Ir a la posici\u00F3n ' + (i + 1));
        (function(idx) { b.addEventListener('click', function() { currentIndex = idx; updateSlider(); }); })(i);
        li.appendChild(b);
        pagination.appendChild(li);
        dots.push(b);
      }
    }

    function getSlidesPerView() { return window.innerWidth >= 768 ? 3 : 1; }

    function updateSlider() {
      var slidesPerView = getSlidesPerView();
      var maxIndex = Math.max(0, slides.length - slidesPerView);
      if (currentIndex > maxIndex) currentIndex = maxIndex;
      /* Desplazamiento en píxeles enteros: evita que las fotos se vean borrosas */
      var target = slides[currentIndex];
      var offset = target ? target.offsetLeft - slides[0].offsetLeft : 0;
      trackList.style.transform = 'translate3d(-' + Math.round(offset) + 'px,0,0)';
      rebuildDots(maxIndex + 1);
      dots.forEach(function(dot, i) { dot.classList.toggle('is-active', i === currentIndex); });
      var scrollable = maxIndex > 0;
      if (pagination) pagination.style.display = scrollable ? '' : 'none';
      if (prevBtn) { prevBtn.disabled = currentIndex === 0; prevBtn.style.visibility = scrollable ? '' : 'hidden'; }
      if (nextBtn) { nextBtn.disabled = currentIndex >= maxIndex; nextBtn.style.visibility = scrollable ? '' : 'hidden'; }
    }

    if (prevBtn) prevBtn.addEventListener('click', function() { if (currentIndex > 0) { currentIndex--; updateSlider(); } });
    if (nextBtn) nextBtn.addEventListener('click', function() {
      var maxIndex = Math.max(0, slides.length - getSlidesPerView());
      if (currentIndex < maxIndex) { currentIndex++; updateSlider(); }
    });

    var startX = 0;
    trackList.addEventListener('touchstart', function(e) { startX = e.touches[0].clientX; }, { passive: true });
    trackList.addEventListener('touchend', function(e) {
      var diff = e.changedTouches[0].clientX - startX;
      var maxIndex = Math.max(0, slides.length - getSlidesPerView());
      if (diff < -40 && currentIndex < maxIndex) currentIndex++;
      else if (diff > 40 && currentIndex > 0) currentIndex--;
      updateSlider();
    });

    window.addEventListener('resize', updateSlider);
    updateSlider();

    var observer = new IntersectionObserver(function(entries, obs) {
      if (entries[0].isIntersecting) {
        obs.unobserve(entries[0].target);
        slides.forEach(function(slide, index) {
          setTimeout(function() { slide.classList.add('is-visible-animated'); }, index * 150);
        });
      }
    }, { threshold: 0.15 });
    observer.observe(wrapper);
  }

  function mount() {
    if (document.getElementById(WRAPPER_ID)) return true;
    var comparisonWidget = document.getElementById("wigy-comparison-table-standalone");
    var statsWidget = document.getElementById("wigy-clinical-results-standalone");
    var target = comparisonWidget || statsWidget || document.getElementById("wigy-concerns-standalone");
    if (!target) return false;
    injectStyleOnce();
    var wrapper = document.createElement("section");
    wrapper.id = WRAPPER_ID;
    wrapper.innerHTML = buildHTML();
    target.insertAdjacentElement("afterend", wrapper);
    initTestimonialsSlider(wrapper);
    return true;
  }

  var tries = 0;
  var t = setInterval(function() { tries++; if (mount() || tries >= 80) clearInterval(t); }, 250);
})();
</script>

      document.head.appendChild(fontLink);

    waitForMount(mountSelector, 8000, 100).then(function(mount) {

<!-- BLOQUE: STICKY ADD TO CART BAR -->
<script>
(function() {
  if (window.WIGY_SLUG_BLOCK) return;
  var ID = "wigy-sticky-atc";
  if (document.getElementById(ID)) return;

  var ACCENT = "#2A5F35";
  var ACCENT_END = "#6BA342";

  var css = [
    "#" + ID + "{position:fixed;bottom:0;left:0;right:0;z-index:9999;",
    "background:rgba(255,255,255,0.97);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);",
    "border-top:1px solid rgba(0,0,0,0.06);",
    "box-shadow:0 -8px 30px rgba(0,0,0,0.08);",
    "padding:12px 20px;display:flex;align-items:center;justify-content:center;gap:16px;",
    "transform:translateY(100%);transition:transform 0.35s cubic-bezier(0.4,0,0.2,1);",
    "font-family:'Poppins','Montserrat',sans-serif}",

    "#" + ID + ".visible{transform:translateY(0)}",

    "#" + ID + ".dismiss{transform:translateY(100%);opacity:0;",
    "transition:transform 0.45s cubic-bezier(0.6,0,0.4,1),opacity 0.4s ease}",

    "#" + ID + " .sticky-inner{display:flex;align-items:center;justify-content:space-between;",
    "gap:16px;width:100%;max-width:600px}",

    "#" + ID + " .sticky-info{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1 1 auto;overflow:visible}",

    "#" + ID + " .sticky-name{font-size:13px;font-weight:700;color:#111;",
    "white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.2}",

    "#" + ID + " .sticky-prices{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}",

    "#" + ID + " .sticky-price{font-size:18px;font-weight:900;color:" + ACCENT + ";line-height:1.2}",

    "#" + ID + " .sticky-old-price{font-size:13px;font-weight:600;color:#999;",
    "text-decoration:line-through;line-height:1.2}",

    "#" + ID + " .sticky-btn{background:linear-gradient(135deg," + ACCENT + " 0%," + ACCENT_END + " 100%);",
    "color:#fff;border:none;border-radius:99px;padding:14px 28px;",
    "font-size:15px;font-weight:800;cursor:pointer;text-transform:uppercase;",
    "letter-spacing:0.8px;white-space:nowrap;flex-shrink:0;",
    "box-shadow:0 6px 20px rgba(42,95,53,0.3);",
    "transition:transform 0.2s ease,box-shadow 0.2s ease;position:relative;overflow:hidden}",

    "#" + ID + " .sticky-btn:active{transform:scale(0.97)}",

    "#" + ID + " .sticky-btn::after{content:'';position:absolute;top:-50%;left:-60%;",
    "width:40%;height:200%;background:linear-gradient(105deg,transparent 20%,",
    "rgba(255,255,255,0.15) 50%,transparent 80%);transform:skewX(-15deg);",
    "animation:wigy-sticky-shine 3s ease-in-out infinite}",

    "@keyframes wigy-sticky-shine{0%{left:-60%}40%{left:120%}100%{left:120%}}",

    "@media(max-width:768px){",
    "#" + ID + "{padding:10px 14px}",
    "#" + ID + " .sticky-inner{gap:12px}",
    "#" + ID + " .sticky-name{font-size:12px}",
    "#" + ID + " .sticky-price{font-size:16px}",
    "#" + ID + " .sticky-btn{padding:12px 20px;font-size:13px;letter-spacing:0.5px}}",

    "@media(max-width:380px){",
    "#" + ID + " .sticky-btn{padding:12px 16px;font-size:12px}}"
  ].join("");

  var st = document.createElement("style");
  st.id = ID + "-css";
  st.innerHTML = css;
  document.head.appendChild(st);

  function mount() {
    if (document.getElementById(ID)) return true;

    var realBtn = window.WIGY_DOM.btn();
    if (!realBtn) return false;

    var nameEl = window.WIGY_DOM.title();

    var productName = nameEl ? nameEl.textContent.trim() : "";

    var selectedBundle = document.querySelector("#wigy-premium-bundles .kb-bar.sel .kb-p");
    var oldPriceEl = document.querySelector("#wigy-premium-bundles .kb-bar.sel .kb-op");
    var priceText = selectedBundle ? selectedBundle.textContent.trim() : "";
    var oldPriceText = oldPriceEl ? oldPriceEl.textContent.trim() : "";

    if (!priceText) {
      var pEl = document.querySelector(".js-price-display") ||
                document.querySelector("[data-product-price]") ||
                document.querySelector(".product__info-container .price-item--sale, .product__info-container .price-item--regular");
      priceText = pEl ? pEl.textContent.trim() : "";
    }

    var bar = document.createElement("div");
    bar.id = ID;
    bar.innerHTML =
      '<div class="sticky-inner">' +
        '<div class="sticky-info">' +
          (productName ? '<span class="sticky-name">' + productName + '</span>' : '') +
          '<div class="sticky-prices">' +
            '<span class="sticky-price">' + priceText + '</span>' +
            (oldPriceText ? '<span class="sticky-old-price">' + oldPriceText + '</span>' : '') +
          '</div>' +
        '</div>' +
        '<button class="sticky-btn" type="button">Agregar al carrito</button>' +
      '</div>';

    document.body.appendChild(bar);

    var dismissed = false;
    bar.querySelector(".sticky-btn").addEventListener("click", function() {
      var btn = window.WIGY_DOM.btn();
      if (btn) btn.click();

      dismissed = true;
      bar.classList.remove("visible");
      bar.classList.add("dismiss");

      setTimeout(function() {
        bar.remove();
      }, 500);
    });

    var bundles = document.getElementById("wigy-premium-bundles");
    if (bundles) {
      bundles.addEventListener("click", function() {
        setTimeout(function() {
          var selPrice = bundles.querySelector(".kb-bar.sel .kb-p");
          var selOld = bundles.querySelector(".kb-bar.sel .kb-op");
          if (selPrice) bar.querySelector(".sticky-price").textContent = selPrice.textContent.trim();
          var oldEl = bar.querySelector(".sticky-old-price");
          if (selOld && oldEl) oldEl.textContent = selOld.textContent.trim();
          else if (!selOld && oldEl) oldEl.textContent = "";
        }, 100);
      });
    }

    var observer = new IntersectionObserver(function(entries) {
      if (dismissed) return;
      entries.forEach(function(entry) {
        if (!entry.isIntersecting) {
          var rect = realBtn.getBoundingClientRect();
          if (rect.bottom < 0) {
            bar.classList.add("visible");
          } else {
            bar.classList.remove("visible");
          }
        } else {
          bar.classList.remove("visible");
        }
      });
    }, { threshold: 0 });

    observer.observe(realBtn);
    return true;
  }

  var tries = 0;
  var t = setInterval(function() {
    tries++;
    if (mount() || tries >= 80) clearInterval(t);
  }, 250);
})();
</script>

            '<p class="expert-name">' + cfg.nombre + '</p>' +
            '<p class="expert-role">' + cfg.profesion + '</p>' +
          '</div>' +
          '<p class="expert-quote">\u201C' + cfg.mensaje + '\u201D</p>' +
          '<span class="expert-badge">' + verifiedSvg + ' Profesional verificado</span>' +
        '</div>' +
      '</div>';

    anchor.insertAdjacentElement("afterend", box);
    return true;
  }

  var tries = 0;
  var t = setInterval(function() {
    tries++;
    if (mount() || tries >= 80) clearInterval(t);
  }, 250);
})();
</script>
<!-- BLOQUE: TOAST COMPRAS RECIENTES -->
<script>
(function() {
  if (window.WIGY_SLUG_BLOCK) return;
  var ID = "wigy-social-toast";
  if (document.getElementById(ID + "-css")) return;

  var BASE_SHOW_DURATION = 4500;
  var EXTRA_PER_TOAST = 3000;
  var PAUSE_BETWEEN = 12000;
  var INITIAL_DELAY = 8000;

  var BUYERS = (window.WIGY_CONFIG && window.WIGY_CONFIG.compradoresToast) || [
    { name: "Graciela",   city: "Buenos Aires",  img: "" },
    { name: "Marta",      city: "Córdoba",        img: "" },
    { name: "Silvia",     city: "Rosario",        img: "" },
    { name: "Patricia",   city: "Mendoza",        img: "" },
    { name: "Claudia",    city: "Tucumán",        img: "" },
    { name: "Roberto",    city: "La Plata",       img: "" },
    { name: "Gustavo",    city: "Mar del Plata",  img: "" },
    { name: "Eduardo",    city: "Salta",          img: "" },
    { name: "Ricardo",    city: "Santa Fe",       img: "" },
    { name: "Adriana",    city: "San Juan",       img: "" },
    { name: "Alejandro",  city: "Neuquén",        img: "" },
    { name: "Marcela",    city: "Bahía Blanca",   img: "" },
    { name: "Gabriela",   city: "Resistencia",    img: "" },
    { name: "Jorge",      city: "Posadas",        img: "" },
    { name: "Fernando",   city: "Paraná",         img: "" },
    { name: "Norma",      city: "San Luis",       img: "" },
    { name: "Susana",     city: "Corrientes",     img: "" },
    { name: "Daniel",     city: "Formosa",        img: "" },
    { name: "Hugo",       city: "Bariloche",      img: "" },
    { name: "Andrea",     city: "Ushuaia",        img: "" }
  ];

  var TIMES = [
    "hace 2 min", "hace 4 min", "hace 7 min", "hace 11 min",
    "hace 15 min", "hace 18 min", "hace 23 min", "hace 28 min"
  ];

  function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

  var css = [
    "#" + ID + "{position:fixed;bottom:20px;left:20px;z-index:99999;",
    "max-width:320px;width:calc(100% - 40px);",
    "background:#fff;border-radius:14px;border-left:4px solid #6BA342;",
    "box-shadow:0 10px 40px rgba(0,0,0,0.12),0 2px 8px rgba(0,0,0,0.06);",
    "border:1px solid rgba(0,0,0,0.06);",
    "padding:14px 16px;",
    "display:flex;align-items:center;gap:12px;",
    "font-family:inherit;",
    "transform:translateY(120%);opacity:0;",
    "transition:transform 0.5s cubic-bezier(0.4,0,0.2,1),opacity 0.4s ease;",
    "pointer-events:none}",

    "#" + ID + ".toast-in{transform:translateY(0);opacity:1;pointer-events:auto}",
    "#" + ID + ".toast-out{transform:translateY(120%);opacity:0;pointer-events:none}",

    "#" + ID + " .toast-avatar{width:44px;height:44px;border-radius:50%;",
    "background:linear-gradient(135deg,#2A5F35,#6BA342);",
    "display:flex;align-items:center;justify-content:center;flex:0 0 auto;",
    "overflow:hidden;border:2px solid rgba(42,95,53,0.15)}",

    "#" + ID + " .toast-avatar span{color:#fff;font-size:18px;font-weight:800;line-height:1}",

    "#" + ID + " .toast-avatar img{width:100%;height:100%;object-fit:cover;display:block}",

    "#" + ID + " .toast-body{display:flex;flex-direction:column;gap:2px;min-width:0}",

    "#" + ID + " .toast-name{font-size:13.5px;font-weight:700;color:#111;line-height:1.3;",
    "white-space:nowrap;overflow:hidden;text-overflow:ellipsis}",

    "#" + ID + " .toast-action{font-size:12.5px;color:#555;font-weight:500;line-height:1.3}",

    "#" + ID + " .toast-time{font-size:11.5px;color:#999;font-weight:600;line-height:1.3}",

    "#" + ID + " .toast-verified{display:inline-flex;align-items:center;gap:3px;",
    "color:#2A5F35;font-size:11px;font-weight:700}",

    "#" + ID + " .toast-verified svg{width:12px;height:12px}",

    "@media(max-width:768px){",
    "#" + ID + "{bottom:14px;left:14px;max-width:290px;width:calc(100% - 28px);",
    "padding:12px 14px;gap:10px}",
    "#" + ID + " .toast-avatar{width:40px;height:40px}",
    "#" + ID + " .toast-avatar span{font-size:16px}",
    "#" + ID + " .toast-name{font-size:13px}",
    "#" + ID + " .toast-action{font-size:12px}}",

    "@media(min-width:769px){",
    "#" + ID + "{left:32px;bottom:28px;max-width:340px;width:340px}}"
  ].join("");

  var st = document.createElement("style");
  st.id = ID + "-css";
  st.innerHTML = css;
  document.head.appendChild(st);

  var toast = document.createElement("div");
  toast.id = ID;
  document.body.appendChild(toast);

  var checkSvg = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>';

  function getProductName() {
    var cfgName = window.WIGY_CONFIG && window.WIGY_CONFIG.nombreToast;
    if (cfgName) return cfgName;
    var el = window.WIGY_DOM.title();
    if (el) {
      var text = el.textContent.trim();
      return text.length > 30 ? text.substring(0, 30) + "…" : text;
    }
    return (window.WIGY_CONFIG && window.WIGY_CONFIG.nombreProducto) || "este producto";
  }

  var toastCount = 0;

  function showToast() {
    var buyer = pick(BUYERS);
    var time = pick(TIMES);
    var productName = getProductName();

    var avatarHTML;
    if (buyer.img && buyer.img.length > 0 && buyer.img.indexOf("\u26A0\uFE0F") === -1) {
      avatarHTML = '<div class="toast-avatar"><img src="' + buyer.img + '" alt="' + buyer.name + '"></div>';
    } else {
      avatarHTML = '<div class="toast-avatar"><span>' + buyer.name.charAt(0).toUpperCase() + '</span></div>';
    }

    toast.innerHTML =
      avatarHTML +
      '<div class="toast-body">' +
        '<span class="toast-name">' + buyer.name + ' de ' + buyer.city + '</span>' +
        '<span class="toast-action">Compró ' + productName + ' 🌱</span>' +
        (window.WIGY_CONFIG && window.WIGY_CONFIG.toastMostrarHora ? '<span class="toast-time">' + time + ' · <span class="toast-verified">' + checkSvg + ' Compra verificada</span></span>' : '') +
      '</div>';

    toast.classList.remove("toast-in", "toast-out");
    void toast.offsetWidth;
    toast.classList.add("toast-in");

    var currentDuration = BASE_SHOW_DURATION + (toastCount * EXTRA_PER_TOAST);
    toastCount++;

    setTimeout(function() {
      toast.classList.remove("toast-in");
      toast.classList.add("toast-out");
    }, currentDuration);
  }

  function scheduleNext() {
    var currentDuration = BASE_SHOW_DURATION + (toastCount * EXTRA_PER_TOAST);
    setTimeout(function() {
      showToast();
      scheduleNext();
    }, currentDuration + PAUSE_BETWEEN);
  }

  setTimeout(function() {
    showToast();
    scheduleNext();
  }, INITIAL_DELAY);

})();
</script>

<!-- TICKER HORIZONTAL INFINITO — REEMPLAZO BARRA ANUNCIOS -->
<script>
(function() {
  if (window.WIGY_SLUG_BLOCK) return;
  var ID = "wigy-ticker";
  if (document.getElementById(ID + "-css")) return;

  var MESSAGES = window.WIGY_CONFIG.mensajesTicker;

  var BG_COLOR = "#2A5F35";
  var TEXT_COLOR = "#ffffff";
  var GAP_MOBILE = 60;
  var GAP_DESKTOP = 100;
  var SPEED = 50;
  var REPEATS = 12;

  var css = [
    ".section-adbar,.announcement-bar-section{display:none!important}",
    ".horizontal-ticker{display:none!important}",

    "#" + ID + "{width:100%;background:" + BG_COLOR + ";overflow:hidden;",
    "padding:14px 0;position:relative;z-index:100}",

    "#" + ID + " .ticker-track{display:flex;align-items:center;",
    "column-gap:" + GAP_MOBILE + "px;width:max-content;",
    "animation:wigy-ticker-scroll " + SPEED + "s linear infinite}",

    "#" + ID + " .ticker-item{font-size:14px;font-weight:700;",
    "font-style:italic;text-transform:uppercase;",
    "color:" + TEXT_COLOR + ";white-space:nowrap;line-height:1;flex-shrink:0;",
    "margin:0;padding:0}",

    "@keyframes wigy-ticker-scroll{to{transform:translateX(calc(-50% - " + (GAP_MOBILE / 2) + "px))}}",

    "@media(min-width:750px){",
    "#" + ID + "{padding:18px 0}",
    "#" + ID + " .ticker-track{column-gap:" + GAP_DESKTOP + "px}",
    "#" + ID + " .ticker-item{font-size:16px}",
    "@keyframes wigy-ticker-scroll{to{transform:translateX(calc(-50% - " + (GAP_DESKTOP / 2) + "px))}}}"
  ].join("");

  var st = document.createElement("style");
  st.id = ID + "-css";
  st.innerHTML = css;
  document.head.appendChild(st);

  var itemsHTML = "";
  for (var r = 0; r < REPEATS; r++) {
    for (var i = 0; i < MESSAGES.length; i++) {
      itemsHTML += '<p class="ticker-item">' + MESSAGES[i] + '</p>';
    }
  }

  var bar = document.createElement("div");
  bar.id = ID;
  bar.innerHTML = '<div class="ticker-track">' + itemsHTML + '</div>';

  var originalAdbar = document.querySelector(".section-adbar") || document.querySelector(".announcement-bar-section") || document.querySelector("[id*='announcement-bar']");
  if (originalAdbar && originalAdbar.parentNode) {
    originalAdbar.parentNode.insertBefore(bar, originalAdbar);
  } else {
    document.body.insertBefore(bar, document.body.firstChild);
  }
})();
</script>
