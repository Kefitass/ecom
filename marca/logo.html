<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&display=swap">
<style>
body{margin:0;background:transparent;font-family:'Bricolage Grotesque','Inter Display',sans-serif}
.v{display:inline-flex;align-items:center;gap:22px;padding:30px 40px}
.word{font-weight:800;font-size:96px;letter-spacing:-.035em;line-height:1}
.badge{position:relative;width:120px;height:132px;border-radius:22px;background:#fff;overflow:hidden;box-shadow:0 0 0 5px currentColor inset;display:flex;flex-direction:column;align-items:center;justify-content:flex-end}
.badge .top{position:absolute;top:0;left:0;right:0;height:34px;background:#E8632E}
.badge .n{font-weight:800;font-size:76px;line-height:1;letter-spacing:-.04em;color:#14213D;margin-bottom:12px}
.light{color:#14213D}.dark{color:#fff}
.dark .badge{box-shadow:none}
.icon{width:512px;height:512px;border-radius:0;background:radial-gradient(circle at 80% 10%,#3A3F9E 0%,#14213D 55%,#0B1226 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;color:#fff}
.icon .badge{width:250px;height:270px;border-radius:40px;box-shadow:0 30px 50px rgba(0,0,0,.35)}
.icon .badge .top{height:70px}.icon .badge .n{font-size:160px;margin-bottom:20px}
.icon .lab{font-weight:800;font-size:56px;letter-spacing:.14em}
</style></head><body>
<div id="light" class="v light"><span class="word">Método</span><span class="badge"><span class="top"></span><span class="n">30</span></span></div><br>
<div id="dark" class="v dark"><span class="word">Método</span><span class="badge"><span class="top"></span><span class="n">30</span></span></div><br>
<div id="icon" class="icon"><span class="badge"><span class="top"></span><span class="n">30</span></span><span class="lab">MÉTODO</span></div>
</body></html>
