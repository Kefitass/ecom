<!doctype html><meta charset="utf-8">
<!-- Portada de la página de Facebook (1640x624). Lo importante va en el centro: en el celular se recortan los costados. -->
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{width:1640px;height:624px;overflow:hidden;font-family:Inter,sans-serif;color:#fff;
  background:radial-gradient(circle at 70% 20%,#3B3F9A 0%,#14213D 50%,#0B1226 100%)}
.wrap{position:absolute;left:330px;right:330px;top:0;bottom:0;display:flex;align-items:center;gap:50px}
.txt{flex:1}
.logo{font:900 92px/1 "Inter Display",Inter;letter-spacing:-.03em}
.logo em{font-style:normal;background:#E8632E;border-radius:18px;padding:0 18px;margin-left:12px}
p{margin-top:26px;font:700 36px/1.3 Inter;color:#F5D27A}
small{display:block;margin-top:18px;font:600 26px/1.4 Inter;opacity:.8}
.books{position:relative;width:330px;height:420px;flex:none}
.books img{position:absolute;width:210px;border-radius:6px 12px 12px 6px;box-shadow:0 30px 70px rgba(0,0,0,.6)}
.books img:first-child{left:0;top:40px;transform:rotate(-7deg);z-index:2}
.books img:last-child{left:130px;top:10px;transform:rotate(6deg)}
</style>
<div class="wrap"><div class="txt"><div class="logo">Método<em>30</em></div>
<p>Conseguí trabajo en 30 días</p><small>CV · LinkedIn · Entrevistas · Sueldo</small></div>
<div class="books"><img src="../../ebook/tapas/tapa-consegui-trabajo.png"><img src="../../ebook/tapas/tapa-secretos-de-reclutador.png"></div></div>
