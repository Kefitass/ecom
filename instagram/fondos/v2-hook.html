<!doctype html>
<meta charset="utf-8">
<title>Video 2 · fondo del hook</title>
<!-- 4 segundos para el arranque: CVs que caen al tacho, sellos de DESCARTADO y un bollo final.
     Lo graba grabar.js llamando a render(t), t de 0 a 4 s. -->
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{width:1080px;height:1920px;overflow:hidden;font-family:Inter,sans-serif;
  background:radial-gradient(circle at 50% 22%,#4A2A6E 0%,#14213D 40%,#0B1226 100%)}
.sheet{position:absolute;width:270px;height:350px;margin:-175px 0 0 -135px;background:#fff;border-radius:10px;padding:26px 22px;box-shadow:0 18px 40px rgba(0,0,0,.45)}
.sheet i{display:block;height:12px;border-radius:6px;background:#E2E8F0;margin-bottom:14px}
.sheet i:first-child{height:20px;width:65%;background:#CBD5E1}
.sheet b{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) rotate(-14deg);border:6px solid #E11D48;color:#E11D48;font:900 30px/1 "Inter Display",Inter;padding:8px 12px;border-radius:8px;letter-spacing:.04em;background:rgba(255,255,255,.85);opacity:0}
.bin{position:absolute;left:50%;top:560px;width:500px;height:430px;margin-left:-250px;transform-origin:50% 100%}
.bin .body{position:absolute;left:30px;right:30px;top:40px;bottom:0;background:linear-gradient(90deg,#1B2B57,#2C3E7A 50%,#1B2B57);clip-path:polygon(0 0,100% 0,88% 100%,12% 100%);border-radius:0 0 30px 30px}
.bin .body::before{content:"";position:absolute;inset:40px 70px;background:repeating-linear-gradient(90deg,rgba(255,255,255,.07) 0 14px,transparent 14px 40px)}
.bin .rim{position:absolute;left:0;right:0;top:20px;height:44px;border-radius:22px;background:#E8632E;box-shadow:0 10px 30px rgba(232,99,46,.5)}
.halo{position:absolute;left:50%;top:700px;width:900px;height:900px;margin:-450px 0 0 -450px;border-radius:50%;background:radial-gradient(circle,rgba(225,29,72,.55) 0%,rgba(225,29,72,0) 60%);opacity:0}
.ball{position:absolute;width:150px;height:150px;margin:-75px 0 0 -75px;border-radius:46% 54% 50% 50%;
  background:radial-gradient(circle at 35% 30%,#fff 0%,#E5E7EB 55%,#B8BEC9 100%);box-shadow:0 20px 40px rgba(0,0,0,.5);overflow:hidden}
.ball::before,.ball::after{content:"";position:absolute;inset:0;background:
  linear-gradient(35deg,transparent 45%,rgba(100,116,139,.45) 47%,transparent 50%),
  linear-gradient(-60deg,transparent 40%,rgba(100,116,139,.35) 42%,transparent 45%),
  linear-gradient(100deg,transparent 58%,rgba(100,116,139,.35) 60%,transparent 63%)}
.ball::after{transform:rotate(70deg)}
</style>
<body>
<div class="halo" id="halo"></div>
<div id="sheets"></div>
<div class="bin" id="bin"><div class="rim"></div><div class="body"></div></div>
<div class="ball" id="ball"></div>
<script src="fx.js"></script>
<script>
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const span = (t, a, b) => clamp((t - a) / (b - a));
const $ = id => document.getElementById(id);
const rnd = (s => () => (s = (s * 16807) % 2147483647) / 2147483647)(7);
const BIN = { x: 540, y: 610 };
const N = 26, S = [];
for (let i = 0; i < N; i++) {
  const d = document.createElement('div'); d.className = 'sheet';
  d.innerHTML = '<i></i><i></i><i style="width:80%"></i><i></i><i style="width:70%"></i><i></i><i style="width:85%"></i>' + (rnd() < 0.55 ? '<b>DESCARTADO</b>' : '');
  $('sheets').appendChild(d);
  S.push({ el: d, x0: 60 + rnd() * 960, start: i * 0.1, dur: 0.55 + rnd() * 0.25, rot: (rnd() - .5) * 720, stamp: d.querySelector('b') });
}
function render(t) {
  FX.frame(t);
  let lastLand = -9;
  S.forEach(s => {
    const k = span(t, s.start, s.start + s.dur);
    const e = k * k;                                   // cae acelerando
    const x = s.x0 + (BIN.x - s.x0) * e, y = -300 + (BIN.y + 40 + 300) * e;
    const sc = 1 - 0.55 * e;
    s.el.style.transform = `translate(${x}px, ${y}px) rotate(${s.rot * k}deg) scale(${sc})`;
    s.el.style.opacity = t < s.start ? 0 : (k >= 1 ? 0 : 1);
    if (s.stamp) s.stamp.style.opacity = span(t, s.start + 0.15, s.start + 0.25);
    if (k >= 1) lastLand = Math.max(lastLand, s.start + s.dur);
  });
  // el tacho rebota con cada CV que entra
  const hit = Math.max(0, 1 - (t - lastLand) / 0.2);
  let binT = `scale(${1 + 0.07 * hit}, ${1 - 0.06 * hit})`;
  $('halo').style.opacity = 0.25 + 0.6 * hit + (t > 3.25 ? 0.6 * Math.max(0, 1 - (t - 3.25) / 0.5) : 0);
  // bollo final, al ritmo del gesto de ella (~3 s)
  const kb = span(t, 2.75, 3.25), eb = kb * kb;
  $('ball').style.opacity = t < 2.75 || kb >= 1 ? 0 : 1;
  $('ball').style.transform = `translate(${880 + (BIN.x - 880) * kb}px, ${-200 + (BIN.y + 300) * eb}px) rotate(${kb * 540}deg) scale(${1.4 - 0.5 * kb})`;
  if (t > 3.25) binT += ' ' + FX.shake($('bin'), t, 3.25, 0.4, 22);
  $('bin').style.transform = binT;
  FX.flash(t, 3.25, 0.18);
  if (t > 3.25 && t < 3.7) document.getElementById('fx-stage').style.transform += ' ' + FX.shake(null, t, 3.25, 0.45, 14);
}
FX.init();
render(0);
</script>
</body>
