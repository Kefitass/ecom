<!doctype html>
<meta charset="utf-8">
<title>Creativo A: hook del mismo CV</title>
<!-- Hook del creativo A (7 s): "¿Querés conseguir trabajo? Entonces dejá de mandar el mismo currículum a todos lados".
     Un mismo CV se copia y sale disparado a ocho empresas, que lo rechazan una por una.
     Deja libre la esquina inferior derecha para Cami. Lo graba instagram/fondos/grabar.js llamando a render(t). -->
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{width:1080px;height:1920px;overflow:hidden;font-family:Inter,sans-serif;color:#fff;
  background:radial-gradient(circle at 50% 32%,#2B3A8C 0%,#14213D 45%,#0B1226 100%)}
.glow{position:absolute;left:50%;top:620px;width:1200px;height:1200px;margin:-600px 0 0 -600px;border-radius:50%;
  background:radial-gradient(circle,rgba(232,99,46,.35) 0%,rgba(232,99,46,0) 60%)}
#q{position:absolute;left:0;right:0;top:170px;text-align:center;font:900 92px/1.05 "Inter Display",Inter}
#q em{font-style:normal;color:#F5D27A}
.cv{position:absolute;width:150px;height:200px;margin:-100px 0 0 -75px;border-radius:10px;background:#fff;box-shadow:0 14px 34px rgba(0,0,0,.5);overflow:hidden}
.cv .ph{position:absolute;left:14px;top:14px;width:40px;height:40px;border-radius:50%;background:#F5D27A}
.cv i{position:absolute;left:64px;height:9px;border-radius:5px;background:#C9CFDB}
.cv u{position:absolute;left:14px;height:8px;border-radius:4px;background:#DDE2EC}
.co{position:absolute;width:250px;padding:22px 18px;border-radius:20px;background:#fff;color:#14213D;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.45)}
.co .lg{width:64px;height:64px;margin:0 auto 12px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:36px}
.co .n{font:800 26px/1.1 Inter}
.co .x{position:absolute;inset:0;border-radius:20px;background:rgba(229,72,77,.92);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;font:900 56px/1 Inter}
.co .x small{font:900 22px/1 Inter;letter-spacing:.1em;margin-top:10px}
#tag{position:absolute;left:0;right:0;top:1440px;text-align:center}
#tag span{display:inline-block;padding:16px 30px;border-radius:40px;background:#E5484D;font:900 44px/1 Inter;box-shadow:0 14px 34px rgba(0,0,0,.4)}
</style>
<body>
<div class="glow"></div>
<div id="q">¿Querés conseguir<br><em>trabajo</em>?</div>
<div id="stage"></div>
<div id="tag"><span id="tagt">El mismo CV ×8 → 0 llamadas</span></div>
<script>
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const ease = x => 1 - Math.pow(1 - clamp(x), 3);
const back = x => { x = clamp(x); const c = 1.7; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const span = (t, a, b) => clamp((t - a) / (b - a));
const $ = id => document.getElementById(id);
const COS = [["🏦","Banco"],["🚚","Logística"],["🏥","Clínica"],["🛒","Supermercado"],["💻","Software"],["🏭","Fábrica"],["📞","Call center"],["🏨","Hotel"]];
const COL = ["#E0E7FF","#FFEDD5","#DCFCE7","#FEF3C7","#E0F2FE","#F3E8FF","#FCE7F3","#ECFCCB"];
// posiciones de las empresas: dos columnas a los costados y una fila arriba, lejos de la esquina de Cami
const POS = [[150,560],[150,820],[150,1080],[150,1340],[930,560],[930,820],[930,1080],[540,1210]];
const cvHTML = () => { let h = '<div class="ph"></div>'; for (let j = 0; j < 3; j++) h += `<i style="top:${16 + j * 14}px;width:${60 - j * 12}px"></i>`; for (let j = 0; j < 6; j++) h += `<u style="top:${80 + j * 18}px;width:${110 - (j % 3) * 18}px"></u>`; return h; };
const cos = [], cvs = [];
COS.forEach(([e, n], i) => {
  const d = document.createElement("div"); d.className = "co";
  d.innerHTML = `<div class="lg" style="background:${COL[i]}">${e}</div><div class="n">${n}</div><div class="x">✗<small>DESCARTADO</small></div>`;
  $("stage").appendChild(d); cos.push(d);
  const c = document.createElement("div"); c.className = "cv"; c.innerHTML = cvHTML(); $("stage").appendChild(c); cvs.push(c);
});
const main = document.createElement("div"); main.className = "cv"; main.innerHTML = cvHTML(); $("stage").appendChild(main);
function render(t) {
  // 0–1.4 s: la pregunta y el CV en el centro
  const q = back(span(t, 0, 0.45));
  $("q").style.transform = `scale(${q})`; $("q").style.opacity = span(t, 0, 0.15);
  const m = back(span(t, 0.3, 0.8)), cx = 540, cy = 830;
  Object.assign(main.style, { left: cx + "px", top: cy + "px", transform: `scale(${1.6 * m}) rotate(${Math.sin(t * 3) * 3}deg)`, opacity: span(t, 0.3, 0.4) });
  // las empresas aparecen
  cos.forEach((d, i) => {
    const a = back(span(t, 0.9 + i * 0.07, 1.3 + i * 0.07));
    Object.assign(d.style, { left: (POS[i][0] - 125) + "px", top: (POS[i][1] - 90) + "px", opacity: span(t, 0.9 + i * 0.07, 1.0 + i * 0.07), transform: `scale(${a})` });
  });
  // 1.6–4.2 s: el mismo CV se copia y sale disparado a cada empresa
  cvs.forEach((c, i) => {
    const s0 = 1.6 + i * 0.28, k = ease(span(t, s0, s0 + 0.45));
    const x = cx + (POS[i][0] - cx) * k, y = cy + (POS[i][1] - cy) * k - Math.sin(k * Math.PI) * 120;
    Object.assign(c.style, { left: x + "px", top: y + "px", opacity: t >= s0 && k < 1 ? 1 : 0, transform: `scale(${1.3 - 0.6 * k}) rotate(${k * 360}deg)` });
    // la empresa lo rechaza
    const r = back(span(t, s0 + 0.5, s0 + 0.8));
    const x2 = cos[i].querySelector(".x");
    x2.style.opacity = span(t, s0 + 0.5, s0 + 0.6); x2.style.transform = `scale(${r})`;
    if (t > s0 + 0.5 && t < s0 + 0.8) cos[i].style.transform += ` translateX(${Math.sin(t * 80) * 6}px)`;
  });
  // 4.6 s: la etiqueta final
  const tg = back(span(t, 4.6, 5.0));
  $("tag").style.opacity = span(t, 4.6, 4.7); $("tag").style.transform = `scale(${tg})`;
  main.style.filter = t > 4.6 ? `grayscale(${span(t, 4.6, 5.2)})` : "none";
}
render(0);
</script>
