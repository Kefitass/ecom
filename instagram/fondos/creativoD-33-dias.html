<!doctype html>
<meta charset="utf-8">
<title>Creativo D: 33 días</title>
<!-- Fondo del clip 2 del creativo D (8 s): el contador de días hasta el 33 y el mail de bienvenida,
     y después los avisos con sueldos bajos y horarios eternos que tenía antes.
     Deja libre la esquina inferior derecha para Cami. Lo graba instagram/fondos/grabar.js llamando a render(t). -->
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{width:1080px;height:1920px;overflow:hidden;font-family:Inter,sans-serif;color:#fff;
  background:radial-gradient(circle at 50% 30%,#2B3A8C 0%,#14213D 45%,#0B1226 100%)}
.glow{position:absolute;left:50%;top:640px;width:1200px;height:1200px;margin:-600px 0 0 -600px;border-radius:50%;
  background:radial-gradient(circle,rgba(232,99,46,.35) 0%,rgba(232,99,46,0) 60%)}
#cal{position:absolute;left:290px;top:260px;width:500px;border-radius:28px;overflow:hidden;background:#fff;box-shadow:0 40px 90px rgba(0,0,0,.55);text-align:center}
#cal .top{background:#E8632E;padding:22px 0;font:800 34px/1 Inter;letter-spacing:.12em}
#cal .num{color:#14213D;font:900 230px/1 "Inter Display",Inter;padding:24px 0 6px}
#cal .lab{color:#5A6478;font:700 34px/1 Inter;padding-bottom:30px}
#mail{position:absolute;left:110px;top:860px;width:860px;padding:30px 34px;border-radius:26px;background:#fff;color:#14213D;box-shadow:0 40px 90px rgba(0,0,0,.55);display:flex;gap:26px;align-items:center}
#mail .ic{flex:none;width:96px;height:96px;border-radius:24px;background:#16A34A;display:flex;align-items:center;justify-content:center;font-size:54px}
#mail .from{font:700 26px/1 Inter;color:#5A6478}
#mail .sub{font:900 44px/1.1 "Inter Display",Inter;margin-top:10px}
#mail .sub em{font-style:normal;color:#16A34A}
.ad{position:absolute;left:90px;width:760px;padding:28px 32px;border-radius:24px;background:#fff;color:#14213D;box-shadow:0 30px 70px rgba(0,0,0,.5)}
.ad .t{font:900 38px/1.1 "Inter Display",Inter}
.ad .r{display:flex;gap:16px;margin-top:16px;flex-wrap:wrap}
.ad .p{padding:10px 18px;border-radius:12px;font:800 28px/1 Inter;background:#FDECEC;color:#B42318}
.ad .x{position:absolute;right:26px;top:26px;width:58px;height:58px;border-radius:50%;background:#E5484D;color:#fff;font:900 34px/58px Inter;text-align:center}
#antes{position:absolute;left:0;right:0;top:220px;text-align:center;font:900 76px/1 "Inter Display",Inter}
#antes em{font-style:normal;color:#FF5A5F}
</style>
<body>
<div class="glow"></div>
<div id="cal"><div class="top">DÍA</div><div class="num" id="num">1</div><div class="lab" id="lab">de su plan</div></div>
<div id="mail"><div class="ic">✉️</div><div><div class="from">Recursos Humanos</div><div class="sub">¡Bienvenida al equipo, <em>Isabela</em>! 🎉</div></div></div>
<div id="antes">Y <em>antes</em>…</div>
<div class="ad" id="a0"><div class="t">Atención al público</div><div class="r"><span class="p">Sueldo bajísimo</span><span class="p">12 horas por día</span></div><div class="x">✗</div></div>
<div class="ad" id="a1"><div class="t">Vendedora de salón</div><div class="r"><span class="p">Sin registrar</span><span class="p">Sábados y domingos</span></div><div class="x">✗</div></div>
<div class="ad" id="a2"><div class="t">Administrativa</div><div class="r"><span class="p">Horario rotativo</span><span class="p">Media jornada mal paga</span></div><div class="x">✗</div></div>
<script>
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const ease = x => 1 - Math.pow(1 - clamp(x), 3);
const back = x => { x = clamp(x); const c = 1.7; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const span = (t, a, b) => clamp((t - a) / (b - a));
const $ = id => document.getElementById(id);
function render(t) {
  // 0–3.6 s: contador del día 1 al 33 y mail de bienvenida
  const out1 = 1 - ease(span(t, 3.6, 4.0));
  const c = ease(span(t, 0, 0.4)), k = ease(span(t, 0.2, 2.2));
  $("num").textContent = Math.max(1, Math.round(1 + 32 * k));
  const pulse = t > 2.2 ? 1 + 0.08 * Math.sin(span(t, 2.2, 2.6) * Math.PI) : 1;
  $("cal").style.transform = `scale(${(0.7 + 0.3 * c) * pulse})`;
  $("cal").style.opacity = Math.min(c, out1);
  $("num").style.color = t > 2.2 ? "#16A34A" : "#14213D";
  $("lab").textContent = t > 2.2 ? "¡con trabajo nuevo!" : "de su plan";
  const m = back(span(t, 2.3, 2.8));
  $("mail").style.transform = `translateY(${(1 - m) * 160}px) scale(${0.9 + 0.1 * m})`;
  $("mail").style.opacity = Math.min(span(t, 2.3, 2.5), out1);
  // 4–8 s: "Y antes…" y los avisos malos que le ofrecían
  $("antes").style.opacity = ease(span(t, 4.0, 4.4));
  for (let i = 0; i < 3; i++) {
    const a = back(span(t, 4.5 + i * 0.6, 5.0 + i * 0.6));
    Object.assign($("a" + i).style, { top: (380 + i * 250) + "px", opacity: span(t, 4.5 + i * 0.6, 4.7 + i * 0.6),
      transform: `translateX(${(1 - a) * -300}px) rotate(${(i - 1) * 1.5}deg)` });
    $("a" + i).querySelector(".x").style.transform = `scale(${back(span(t, 4.9 + i * 0.6, 5.2 + i * 0.6))})`;
  }
}
render(0);
</script>
