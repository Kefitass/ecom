<!doctype html>
<meta charset="utf-8">
<title>Creativo B con voz propia: segundos 0 a 13</title>
<!-- Fondo de los primeros 13 s del creativo B grabado con voz propia:
     0-3 «¡Pará! Dejá de mandar currículums» · 3-6 «el mismo a todos lados» ·
     6-9 «las empresas filtran con un programa» · 9-13 «sin las palabras del aviso, lo descarta sin leerlo».
     Deja libre la esquina inferior derecha. Lo graba instagram/fondos/grabar.js llamando a render(t). -->
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{width:1080px;height:1920px;overflow:hidden;font-family:Inter,sans-serif;color:#fff;
  background:radial-gradient(circle at 50% 32%,#2B3A8C 0%,#14213D 45%,#0B1226 100%)}
.glow{position:absolute;left:50%;top:700px;width:1200px;height:1200px;margin:-600px 0 0 -600px;border-radius:50%;
  background:radial-gradient(circle,rgba(232,99,46,.32) 0%,rgba(232,99,46,0) 60%)}
.cv{position:absolute;z-index:3;width:150px;height:200px;margin:-100px 0 0 -75px;border-radius:10px;background:#fff;box-shadow:0 14px 34px rgba(0,0,0,.45);overflow:hidden}
.cv .ph{position:absolute;left:14px;top:14px;width:40px;height:40px;border-radius:50%;background:#F5D27A}
.cv i{position:absolute;left:64px;height:9px;border-radius:5px;background:#C9CFDB}
.cv u{position:absolute;left:14px;height:8px;border-radius:4px;background:#DDE2EC}
.big{position:absolute;left:0;right:0;text-align:center;font:900 120px/1 "Inter Display",Inter;letter-spacing:-.02em}
.lbl{position:absolute;left:0;right:0;text-align:center;font:900 64px/1.1 "Inter Display",Inter}
.lbl em{font-style:normal;color:#F5D27A}
#stamp{position:absolute;z-index:10;left:50%;top:700px;padding:26px 54px;border:14px solid #E5484D;border-radius:26px;color:#E5484D;
  font:900 150px/1 "Inter Display",Inter;transform-origin:50% 50%;background:rgba(11,18,38,.55)}
#hand{position:absolute;left:50%;top:420px;font-size:200px;margin-left:-100px}
.send{position:absolute;z-index:2;padding:14px 26px;border-radius:14px;background:#E8632E;font:800 38px/1 Inter;box-shadow:0 10px 26px rgba(0,0,0,.4)}
#machine{position:absolute;z-index:5;left:140px;top:1000px;width:600px;height:360px;border-radius:40px;background:linear-gradient(180deg,#1E2A5A,#101833);
  border:4px solid rgba(255,255,255,.12);box-shadow:0 30px 70px rgba(0,0,0,.5)}
#machine .slot{position:absolute;left:200px;top:-6px;width:200px;height:16px;border-radius:8px;background:#05070F}
#machine .scr{position:absolute;left:50px;top:60px;width:500px;height:130px;border-radius:20px;background:#05070F;display:flex;align-items:center;justify-content:center;
  font:900 46px/1 "Inter Display",Inter;color:#7CF0C0;letter-spacing:.02em}
#machine .led{position:absolute;top:235px;width:44px;height:44px;border-radius:50%}
#laser{position:absolute;z-index:6;left:140px;width:600px;height:8px;border-radius:4px;background:#FF3B3B;box-shadow:0 0 34px 12px rgba(255,59,59,.55)}
#aviso{position:absolute;left:90px;top:300px;width:470px;padding:28px;border-radius:22px;background:#fff;color:#14213D;box-shadow:0 30px 70px rgba(0,0,0,.5)}
#aviso .k{font:800 18px/1 Inter;letter-spacing:.14em;color:#E8632E}
#aviso .t{font:900 34px/1.1 "Inter Display",Inter;margin:10px 0 18px}
.chip{display:flex;justify-content:space-between;align-items:center;margin-top:12px;padding:13px 16px;border-radius:12px;background:#F1F4FA;font:700 28px/1 Inter}
.chip b{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#C4CAD6;color:#fff;font:900 24px/1 Inter}
.chip.no{background:#FDECEC;color:#B42318}.chip.no b{background:#E5484D}
#bin{position:absolute;left:640px;top:860px;width:260px;height:300px}
#eye{position:absolute;left:0;right:0;top:1230px;text-align:center;font:900 60px/1.1 "Inter Display",Inter}
#eye em{font-style:normal;color:#FF5A5F}
</style>
<body>
<div class="glow"></div>
<div id="s1"><div id="hand">✋</div><div id="stamp">¡PARÁ!</div></div>
<div id="s2"><div class="lbl" id="l2" style="top:240px">El mismo CV a <em>todos lados</em></div></div>
<div id="s3"><div class="lbl" id="l3" style="top:240px">Un <em>programa</em> lo filtra</div>
  <div id="machine"><div class="slot"></div><div class="scr" id="scr">FILTRO ATS</div>
    <div class="led" style="left:180px;background:#16A34A" id="led1"></div><div class="led" style="left:280px;background:#F5D27A" id="led2"></div><div class="led" style="left:380px;background:#E5484D" id="led3"></div></div>
  <div id="laser"></div></div>
<div id="s4"><div id="aviso"><div class="k">EL AVISO PIDE</div><div class="t">Analista administrativo</div>
  <div class="chip" id="c0">Excel <b>?</b></div><div class="chip" id="c1">Facturación <b>?</b></div><div class="chip" id="c2">Cobranzas <b>?</b></div><div class="chip" id="c3">SAP <b>?</b></div></div>
  <svg id="bin" viewBox="0 0 260 300"><rect x="20" y="40" width="220" height="24" rx="10" fill="#8A93AD"/><rect x="95" y="16" width="70" height="30" rx="8" fill="#8A93AD"/>
    <path d="M40 74 h180 l-18 210 a14 14 0 0 1 -14 12 h-116 a14 14 0 0 1 -14 -12 z" fill="#5A6478"/><path d="M90 110 v150 M130 110 v150 M170 110 v150" stroke="#3D4560" stroke-width="12" stroke-linecap="round"/></svg>
  <div id="eye">Descartado <em>sin que nadie lo lea</em> 👁️‍🗨️</div></div>
<div id="cvs"></div>
<script>
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x)), ease=x=>1-Math.pow(1-clamp(x),3);
const back=x=>{x=clamp(x);const c=1.7;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
const span=(t,a,b)=>clamp((t-a)/(b-a)), $=id=>document.getElementById(id);
const cvHTML=()=>{let h='<div class="ph"></div>';for(let j=0;j<3;j++)h+=`<i style="top:${16+j*14}px;width:${60-j*12}px"></i>`;for(let j=0;j<6;j++)h+=`<u style="top:${80+j*18}px;width:${110-(j%3)*18}px"></u>`;return h;};
// 12 copias del mismo CV + 6 botones "Enviar"
const CV=[];for(let i=0;i<12;i++){const d=document.createElement('div');d.className='cv';d.innerHTML=cvHTML();$('cvs').appendChild(d);CV.push(d);}
const SEND=[];for(let i=0;i<6;i++){const d=document.createElement('div');d.className='send';d.textContent='Enviar ➜';document.body.appendChild(d);SEND.push(d);}
const R=n=>{let x=Math.sin(n*9301+49297)*233280;return x-Math.floor(x)};
function show(id,a,b){const o=Math.min(span(t0,a,a+0.2),1-span(t0,b-0.2,b));$(id).style.opacity=o;return o;}
let t0=0;
function render(t){t0=t;
  // 0-3: botones "Enviar" que salen disparados y se frenan con ¡PARÁ!
  show('s1',0,3.1);
  SEND.forEach((d,i)=>{const s=i*0.12,k=span(t,s,s+0.9),stop=t>1.0;const y=1500-k*900-(stop?0:0),x=120+i*150;
    d.style.left=x+'px';d.style.top=(stop?1500-span(1.0,s,s+0.9)*900:y)+'px';d.style.opacity=t<3?Math.min(span(t,s,s+0.1),1-span(t,2.8,3)):0;
    d.style.filter=stop?'grayscale(1)':'none';d.style.transform=`rotate(${(R(i)-.5)*20}deg)`;});
  const st=span(t,0.95,1.2),sh=t>1.2&&t<1.6?Math.sin(t*90)*10*(1-span(t,1.2,1.6)):0;
  $('stamp').style.opacity=st>0?1:0;$('stamp').style.transform=`translateX(calc(-50% + ${sh}px)) rotate(-8deg) scale(${2.4-1.4*ease(st)})`;
  $('hand').style.transform=`scale(${back(span(t,0.1,0.5))})`;$('hand').style.opacity=span(t,0.1,0.2);
  // 3-6: un CV se copia 12 veces y quedan todos iguales
  show('s2',3,6.1);$('l2').style.transform=`scale(${back(span(t,3.05,3.4))})`;
  // 6-9: los CV entran a la máquina de filtro
  show('s3',6,9.1);$('l3').style.transform=`scale(${back(span(t,6.05,6.4))})`;
  $('machine').style.transform=`translateY(${(1-ease(span(t,6,6.4)))*120}px)`;
  const sc=span(t,6.6,8.9);$('laser').style.top=(1010+330*((sc*3)%1))+'px';$('laser').style.opacity=t>6.5&&t<8.9?1:0;
  $('scr').textContent=t<7.2?'FILTRO ATS':(t<8.1?'ESCANEANDO…':'BUSCANDO PALABRAS');
  ['led1','led2','led3'].forEach((id,i)=>$(id).style.opacity=0.35+0.65*((Math.floor(t*6)+i)%3===0?1:0));
  // 9-13: el aviso pide palabras que no están → a la basura sin leer
  show('s4',9,13.2);$('aviso').style.transform=`translateX(${(1-ease(span(t,9,9.4)))*-500}px)`;
  for(let i=0;i<4;i++){const on=t>=9.6+i*0.4,c=$('c'+i);c.className='chip'+(on?' no':'');c.querySelector('b').textContent=on?'✗':'?';
    c.style.transform=`scale(${on?1+0.12*(1-span(t,9.6+i*0.4,9.85+i*0.4)):1})`;}
  $('bin').style.transform=`translateY(${(1-ease(span(t,9.2,9.6)))*200}px)`;$('bin').style.opacity=span(t,9.2,9.4);
  $('eye').style.opacity=span(t,11.6,11.9);$('eye').style.transform=`scale(${back(span(t,11.6,12.0))})`;
  // los CV: aparecen en 3-6, viajan a la máquina en 6-9 y uno cae a la basura en 9-13
  CV.forEach((d,i)=>{let x,y,s,o,r=0,f='none';
    const col=i%4,row=Math.floor(i/4);const gx=230+col*205,gy=470+row*235;
    if(t<3){o=0;x=540;y=900;s=1;}
    else if(t<6){const k=back(span(t,3.2+i*0.07,3.6+i*0.07));x=540+(gx-540)*k;y=900+(gy-900)*k;s=0.6+0.5*k;o=span(t,3.2+i*0.07,3.3+i*0.07);
      if(t>5.2){f=`grayscale(${span(t,5.2,5.8)})`;}r=(R(i)-.5)*8;}
    else if(t<9){const k=ease(span(t,6.2+i*0.12,6.8+i*0.12));x=gx+(440-gx)*k;y=gy+(1010-gy)*k;s=1.05-0.75*k;o=1-span(t,6.7+i*0.12,6.8+i*0.12);f='grayscale(1)';}
    else{o=0;x=540;y=560;s=0.2;}
    if(i===0&&t>=9){const k=span(t,10.6,11.5);o=t<13?Math.min(span(t,9.3,9.5),1):0;x=770;y=500+k*560;s=1.2;r=k*200;f='grayscale(1)';}
    Object.assign(d.style,{left:x+'px',top:y+'px',opacity:o,transform:`scale(${s}) rotate(${r}deg)`,filter:f});});
}
render(0);
</script>
