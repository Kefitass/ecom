<!doctype html>
<meta charset="utf-8">
<title>Creativo C: CV de Canva contra el aviso</title>
<!-- Fondo del creativo C, del final del clip 1 al clip 2 (10 s):
     un CV estilo Canva con foto y columnas, el aviso con sus palabras clave, el escáner que no las encuentra y el sello DESCARTADO.
     Deja libre la esquina inferior derecha para Cami. Lo graba instagram/fondos/grabar.js llamando a render(t). -->
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{width:1080px;height:1920px;overflow:hidden;font-family:Inter,sans-serif;color:#fff;
  background:radial-gradient(circle at 50% 30%,#2B3A8C 0%,#14213D 45%,#0B1226 100%)}
.glow{position:absolute;left:50%;top:700px;width:1200px;height:1200px;margin:-600px 0 0 -600px;border-radius:50%;
  background:radial-gradient(circle,rgba(232,99,46,.35) 0%,rgba(232,99,46,0) 60%)}
.cv{position:absolute;left:90px;top:330px;width:560px;height:790px;background:#FFF7EC;border-radius:18px;overflow:hidden;
  box-shadow:0 40px 90px rgba(0,0,0,.55);transform-origin:50% 50%}
.cv .side{position:absolute;left:0;top:0;bottom:0;width:200px;background:linear-gradient(180deg,#F472B6,#A855F7)}
.cv .photo{position:absolute;left:40px;top:40px;width:120px;height:120px;border-radius:50%;background:#FDE68A;border:6px solid #fff;overflow:hidden}
.cv .photo:before{content:"";position:absolute;left:30px;top:18px;width:48px;height:48px;border-radius:50%;background:#B45309}
.cv .photo:after{content:"";position:absolute;left:12px;top:72px;width:84px;height:70px;border-radius:42px 42px 0 0;background:#B45309}
.cv .sb{position:absolute;left:30px;height:12px;border-radius:6px;background:rgba(255,255,255,.75)}
.cv .ic{position:absolute;left:30px;width:26px;height:26px;border-radius:50%;background:#FDE68A}
.cv .name{position:absolute;left:230px;top:50px;font:900 38px/1.05 "Inter Display",Inter;color:#7C3AED}
.cv .role{position:absolute;left:230px;top:140px;font:700 20px/1 Inter;color:#EC4899;letter-spacing:.08em}
.cv .h{position:absolute;left:230px;height:16px;width:150px;border-radius:8px;background:#F472B6}
.cv .l{position:absolute;left:230px;height:11px;border-radius:6px;background:#D6CBE6}
.cv .bar{position:absolute;left:230px;height:16px;border-radius:8px;background:#EDE3F7;overflow:hidden}
.cv .bar i{display:block;height:100%;background:linear-gradient(90deg,#F472B6,#A855F7)}
.cv .star{position:absolute;font-size:30px}
.tag{position:absolute;padding:14px 26px;border-radius:40px;font:800 34px/1 Inter;color:#0B1226;background:#F5D27A;box-shadow:0 14px 34px rgba(0,0,0,.4);white-space:nowrap}
.aviso{position:absolute;left:560px;top:250px;width:450px;padding:30px 30px 34px;background:#fff;border-radius:20px;color:#14213D;box-shadow:0 40px 90px rgba(0,0,0,.55)}
.aviso .k{font:800 18px/1 Inter;letter-spacing:.14em;color:#E8632E}
.aviso .t{font:900 34px/1.1 "Inter Display",Inter;margin:12px 0 22px}
.chip{display:flex;align-items:center;justify-content:space-between;margin-top:14px;padding:14px 18px;border-radius:14px;background:#F1F4FA;font:700 28px/1 Inter}
.chip b{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font:900 26px/1 Inter;color:#fff;background:#C4CAD6}
.chip.no{background:#FDECEC;color:#B42318}
.chip.no b{background:#E5484D}
.scan{position:absolute;left:70px;width:600px;height:8px;border-radius:4px;background:#FF3B3B;box-shadow:0 0 30px 10px rgba(255,59,59,.55)}
.count{position:absolute;left:0;right:0;top:1180px;text-align:center;font:900 64px/1 "Inter Display",Inter}
.count em{font-style:normal;color:#FF5A5F}
.stamp{position:absolute;z-index:5;left:110px;top:620px;padding:22px 40px;border:10px solid #E5484D;border-radius:18px;color:#E5484D;font:900 92px/1 "Inter Display",Inter;letter-spacing:.04em;transform-origin:50% 50%;background:rgba(255,255,255,.06)}
</style>
<body>
<div class="glow"></div>
<div class="cv" id="cv">
  <div class="side"></div><div class="photo"></div>
  <div class="sb" style="top:200px;width:130px"></div><div class="sb" style="top:225px;width:100px"></div>
  <div class="ic" style="top:290px"></div><div class="sb" style="top:297px;left:66px;width:100px"></div>
  <div class="ic" style="top:335px"></div><div class="sb" style="top:342px;left:66px;width:90px"></div>
  <div class="ic" style="top:380px"></div><div class="sb" style="top:387px;left:66px;width:110px"></div>
  <div class="sb" style="top:470px;width:120px"></div><div class="sb" style="top:500px;width:90px"></div><div class="sb" style="top:530px;width:130px"></div>
  <div class="star" style="left:34px;top:600px">⭐⭐⭐</div><div class="star" style="left:34px;top:650px">⭐⭐</div>
  <div class="name">Martina<br>López</div><div class="role">✨ CREATIVA Y PROACTIVA ✨</div>
  <div class="h" style="top:200px"></div>
  <div class="l" style="top:235px;width:290px"></div><div class="l" style="top:258px;width:250px"></div><div class="l" style="top:281px;width:270px"></div>
  <div class="h" style="top:330px"></div>
  <div class="l" style="top:365px;width:280px"></div><div class="l" style="top:388px;width:230px"></div><div class="l" style="top:411px;width:260px"></div>
  <div class="h" style="top:460px"></div>
  <div class="bar" style="top:500px;width:290px"><i style="width:80%"></i></div>
  <div class="bar" style="top:530px;width:290px"><i style="width:60%"></i></div>
  <div class="bar" style="top:560px;width:290px"><i style="width:90%"></i></div>
  <div class="h" style="top:620px"></div>
  <div class="l" style="top:655px;width:280px"></div><div class="l" style="top:678px;width:200px"></div><div class="l" style="top:701px;width:250px"></div>
</div>
<div class="tag" id="tag1">Hecho en Canva 🎨</div>
<div class="tag" id="tag2">Con fotito 📸</div>
<div class="aviso" id="aviso">
  <div class="k">EL AVISO PIDE</div>
  <div class="t">Analista administrativo</div>
  <div class="chip" id="c0">Excel <b>?</b></div>
  <div class="chip" id="c1">Facturación <b>?</b></div>
  <div class="chip" id="c2">Atención al cliente <b>?</b></div>
  <div class="chip" id="c3">Cuentas a pagar <b>?</b></div>
  <div class="chip" id="c4">SAP <b>?</b></div>
</div>
<div class="scan" id="scan"></div>
<div class="count" id="count">Palabras del aviso: <em id="n">0</em> de 5</div>
<div class="stamp" id="stamp">DESCARTADO</div>
<script>
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const ease = x => 1 - Math.pow(1 - clamp(x), 3);
const back = x => { x = clamp(x); const c = 1.7; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const span = (t, a, b) => clamp((t - a) / (b - a));
const $ = id => document.getElementById(id);
function render(t) {
  // 0–4 s: el CV de Canva aparece grande y centrado, con las etiquetas
  const intro = ease(span(t, 0, 0.6)), move = ease(span(t, 3.6, 4.4));
  const s = (0.55 + 0.45 * intro) * (1.25 - 0.25 * move) + 0.02 * Math.sin(t * 1.3);
  const x = 170 * (1 - move), y = 60 * (1 - move);
  const dim = span(t, 8.2, 8.8);
  $("cv").style.transform = `translate(${x}px,${y}px) scale(${s}) rotate(${-3 * (1 - move) - 2 * dim}deg)`;
  $("cv").style.opacity = intro;
  $("cv").style.filter = `grayscale(${dim}) brightness(${1 - 0.35 * dim})`;
  const t1 = back(span(t, 0.8, 1.3)), t2 = back(span(t, 1.8, 2.3)), out = 1 - ease(span(t, 3.6, 4.0));
  Object.assign($("tag1").style, { left: "600px", top: "760px", transform: `scale(${t1})`, opacity: Math.min(t1, out) });
  Object.assign($("tag2").style, { left: "120px", top: "250px", transform: `scale(${t2})`, opacity: Math.min(t2, out) });
  // 4–5 s: entra el aviso
  const av = ease(span(t, 4.2, 5.0));
  $("aviso").style.transform = `translateX(${(1 - av) * 520}px) rotate(${2 * (1 - av)}deg)`;
  $("aviso").style.opacity = av;
  // 5–8 s: el escáner recorre el CV y ninguna palabra aparece
  const sc = span(t, 5.1, 8.0);
  Object.assign($("scan").style, { top: (330 + 790 * ((sc * 2) % 1)) + "px", opacity: sc > 0 && sc < 1 ? 1 : 0 });
  let n = 0;
  for (let i = 0; i < 5; i++) {
    const on = t >= 5.5 + i * 0.5, c = $("c" + i);
    c.className = "chip" + (on ? " no" : "");
    c.querySelector("b").textContent = on ? "✗" : "?";
    const pop = on ? 1 + 0.12 * (1 - span(t, 5.5 + i * 0.5, 5.75 + i * 0.5)) : 1;
    c.style.transform = `scale(${pop})`;
  }
  $("count").style.opacity = ease(span(t, 5.2, 5.6));
  $("n").textContent = n;
  // 8.3 s: cae el sello
  const st = span(t, 8.3, 8.6), shake = t > 8.6 && t < 8.9 ? Math.sin(t * 90) * 8 * (1 - span(t, 8.6, 8.9)) : 0;
  $("stamp").style.opacity = st > 0 ? 1 : 0;
  $("stamp").style.transform = `translateX(${shake}px) rotate(-14deg) scale(${2.4 - 1.4 * ease(st)})`;
}
render(0);
</script>
