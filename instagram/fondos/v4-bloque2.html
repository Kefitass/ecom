<style>

.stamp{position:absolute;left:260px;top:820px;transform:rotate(-10deg);border:12px solid #E11D48;color:#E11D48;font:900 80px/1 "Inter Display",Inter;padding:18px 30px;border-radius:22px;background:rgba(255,255,255,.95);opacity:0;z-index:8;white-space:nowrap}
</style>
<body>

<div class="wrap" id="wrap">

<script src="fx.js"></script>
<script>
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const span = (t, a, b) => clamp((t - a) / (b - a));
const $ = id => document.getElementById(id);
const CODE = 'Tu N0mbre ▯▯ Analista ?? Crea\n▮▮▮ 11 55▯5-▯▯55 mail@\n<span class="g">[ícono] [ícono] [ícono]</span>\nBuen▯s Aires Sobre m▯\n<span class="g">█████ ███ ████ ██</span>\nExper▯encia ?? ▯▯▯▯\n<span class="g">Habilidades: ¿? ¿? ¿?</span>\nEstud▯os ▮▮▮ ▯▯ ...';
function typed(p) { // escribe el texto sin romper las etiquetas
  const plain = CODE.replace(/<[^>]+>/g, ''); let n = Math.round(plain.length * p), out = '', c = 0, i = 0, open = false;
  while (i < CODE.length && c < n) { if (CODE[i] === '<') { const j = CODE.indexOf('>', i); const tag = CODE.slice(i, j + 1); open = !tag.startsWith('</'); out += tag; i = j + 1; continue; } out += CODE[i] === '\n' ? '<br>' : CODE[i]; i++; c++; }
  return out + (open ? '</span>' : '');
}
const CH = [['c1', 'hcol', 2.0], ['c2', 'hic', 2.6], ['c3', null, 3.1], ['c4', 'hbar', 3.6]];
function render(t) {
  FX.frame(t);
  const ti = FX.enter($('title'), t, 0, 0.4); $('title').style.transform = `scale(${1.3 - 0.3 * ti})`;
  const w = $('wrap'), e = FX.enter(w, t, 0.1, 0.6);
  // 1 · columnas, íconos, colores y barritas, cada uno cuando lo dice
  CH.forEach(([c, h, a], i) => {
    const end = i < 3 ? CH[i + 1][2] : 4.5, k = span(t, a, a + 0.15) * (1 - span(t, end - 0.05, end + 0.1));
    $(c).style.opacity = k; $(c).style.transform = `scale(${1.3 - 0.3 * span(t, a, a + 0.15)})`;
    if (h) $(h).style.opacity = k * (0.7 + 0.3 * Math.sin(t * 10));
  });
  const hue = t > 3.1 && t < 3.7 ? (t - 3.1) * 600 : 0;
  $('front').style.filter = `hue-rotate(${hue}deg) saturate(${t > 3.1 && t < 3.7 ? 1.6 : 1})`;
  [0.92, 0.75, 0.85, 0.6].forEach((v, i) => { $('b' + (i + 1)).style.width = (100 * v * span(t, 3.6 + i * 0.12, 4.1 + i * 0.12)) + '%'; });
  // 2 · "vos lo ves re lindo"
  ['l1', 'l2', 'l3'].forEach((id, i) => {
    const a = 4.6 + i * 0.15, k = span(t, a, a + 0.25) * (1 - span(t, 5.6, 5.8));
    $(id).style.opacity = k; $(id).style.transform = `scale(${0.4 + 0.6 * k}) translateY(${-10 * Math.sin(t * 5 + i)}px) rotate(${8 * Math.sin(t * 3 + i)}deg)`;
  });
  // 3 · "pero el programa no puede leerlo": el currículum gira y se ve el revoltijo
  const f = span(t, 5.8, 6.25), ef = f < 0.5 ? 2 * f * f : 1 - Math.pow(-2 * f + 2, 2) / 2;
  w.style.transform = `scale(${0.92 + 0.08 * e}) scaleX(${Math.max(0.02, Math.abs(Math.cos(Math.PI * ef)))})`;
  $('front').style.opacity = ef < 0.5 ? 1 : 0; $('backf').style.opacity = ef < 0.5 ? 0 : 1;
  $('code').innerHTML = typed(span(t, 6.2, 7.3));
  const s = span(t, 7.3, 7.5);
  $('stamp').style.opacity = s;
  $('stamp').style.transform = `rotate(-10deg) scale(${2.2 - 1.2 * (1 - Math.pow(1 - s, 3))})`;
  FX.flash(t, 7.5, 0.2);
  if (t > 7.5) w.style.transform += ' ' + FX.shake(w, t, 7.5, 0.35, 12);
}
FX.init();
render(0);
</script>
</body>
