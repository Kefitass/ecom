<!doctype html>
<meta charset="utf-8">
<title>Video 3 · fondo bloque 3</title>
<!-- La fórmula en 3 pasos y la respuesta que sí funciona. render(t), t de 0 a 10 s. -->
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{width:1080px;height:1920px;overflow:hidden;font-family:Inter,sans-serif;color:#14213D;
  background:radial-gradient(circle at 50% 18%,#1F5F4A 0%,#14213D 42%,#0B1226 100%)}
.steps{position:absolute;left:100px;right:100px;top:110px;display:flex;flex-direction:column;gap:18px}
.st{display:flex;align-items:center;gap:26px;background:#fff;border-radius:28px;padding:28px 32px;font:800 40px/1.2 Inter;box-shadow:0 30px 70px rgba(0,0,0,.45);opacity:0}
.st span{flex:none;width:84px;height:84px;border-radius:50%;background:#E8632E;color:#fff;font:900 46px/84px Inter;text-align:center}
.st em{display:block;font-style:normal;font-size:26px;font-weight:600;color:#64748B;margin-top:4px}
.ans{position:absolute;left:100px;right:100px;top:640px;border-radius:32px;background:#DCFCE7;padding:36px 40px;box-shadow:0 0 0 6px #16A34A,0 40px 90px rgba(0,0,0,.5);opacity:0}
.ans small{display:block;font:800 26px/1 Inter;letter-spacing:.12em;text-transform:uppercase;color:#15803D;margin-bottom:14px}
.ans p{font:700 34px/1.42 Inter;color:#14532D}
.ok{position:absolute;right:70px;top:600px;width:120px;height:120px;border-radius:50%;background:#16A34A;color:#fff;font:900 70px/120px Inter;text-align:center;box-shadow:0 0 50px rgba(22,163,74,.7);opacity:0;z-index:3}
</style>
<body>
<div class="steps">
  <div class="st" id="s1"><span>1</span><div>Algo real<em>No inventes una debilidad</em></div></div>
  <div class="st" id="s2"><span>2</span><div>Que no sea clave para el puesto<em>Nada que te deje afuera</em></div></div>
  <div class="st" id="s3"><span>3</span><div>Qué estás haciendo para mejorar<em>Eso es lo que quieren escuchar</em></div></div>
</div>
<div class="ans" id="ans"><small>Así sí</small><p id="ap"></p></div>
<div class="ok" id="ok">✓</div>
<script src="fx.js"></script>
<script>
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const span = (t, a, b) => clamp((t - a) / (b - a));
const $ = id => document.getElementById(id);
const A = '«Me costaba delegar. Empecé a usar un tablero de tareas con responsables y hoy confío más en el equipo.»';
function render(t) {
  FX.frame(t);
  [[1, 0.9], [2, 2.4], [3, 3.9]].forEach(([i, a]) => {
    const el = $('s' + i), e = FX.enter(el, t, a, 0.45);
    el.style.transform = `translateX(${-80 + 80 * e}px) scale(${0.94 + 0.06 * e})`;
    const glow = Math.max(0, 1 - (t - a) / 0.6) * (t > a ? 1 : 0);
    el.style.boxShadow = `0 0 0 ${6 * glow}px #E8632E, 0 30px 70px rgba(0,0,0,.45)`;
  });
  const ea = FX.enter($('ans'), t, 5.4, 0.5); $('ans').style.transform = `translateY(${50 - 50 * ea}px)`;
  $('ap').textContent = A.slice(0, Math.round(A.length * span(t, 5.7, 8.2)));
  const k = span(t, 8.3, 8.55);
  $('ok').style.opacity = k;
  $('ok').style.transform = `scale(${1.8 - 0.8 * k})`;
  FX.flash(t, 8.5, 0.18);
}
FX.init();
render(0);
</script>
</body>
