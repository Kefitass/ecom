<!doctype html>
<meta charset="utf-8">
<title>Creativo D: cierre</title>
<!-- Fondo del clip 4 del creativo D (8 s): Método 30, las dos tapas, el generador de CV incluido y la flecha al botón.
     Deja libre la esquina inferior derecha para Cami. Lo graba instagram/fondos/grabar.js llamando a render(t). -->
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{width:1080px;height:1920px;overflow:hidden;font-family:Inter,sans-serif;color:#fff;
  background:radial-gradient(circle at 50% 34%,#3A3F9E 0%,#14213D 48%,#0B1226 100%)}
.glow{position:absolute;left:50%;top:640px;width:1300px;height:1300px;margin:-650px 0 0 -650px;border-radius:50%;
  background:radial-gradient(circle,rgba(232,99,46,.42) 0%,rgba(232,99,46,0) 60%)}
#logo{position:absolute;left:50%;top:150px;width:420px;margin-left:-210px}
.book{position:absolute;width:330px;border-radius:6px 14px 14px 6px;overflow:hidden;box-shadow:0 40px 90px rgba(0,0,0,.6)}
.book img{display:block;width:100%}
#gen{position:absolute;left:330px;top:560px;width:420px;padding:26px;border-radius:30px;background:#fff;color:#14213D;box-shadow:0 40px 90px rgba(0,0,0,.6);text-align:center}
#gen .k{font:800 20px/1 Inter;letter-spacing:.14em;color:#E8632E}
#gen .t{font:900 36px/1.1 "Inter Display",Inter;margin:10px 0 18px}
#gen .r{width:150px;height:150px;margin:0 auto;border-radius:50%;background:conic-gradient(#16A34A 331deg,#E5E7EB 0);display:flex;align-items:center;justify-content:center}
#gen .r b{width:118px;height:118px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;font:900 52px/1 "Inter Display",Inter}
#gen .s{margin-top:16px;font:700 24px/1.2 Inter;color:#16A34A}
#badge{position:absolute;left:0;right:0;top:1060px;text-align:center}
#badge span{display:inline-block;padding:18px 34px;border-radius:50px;background:#F5D27A;color:#0B1226;font:900 40px/1 Inter;box-shadow:0 14px 34px rgba(0,0,0,.4)}
#dia{position:absolute;left:0;right:0;top:1170px;text-align:center;font:900 84px/1 "Inter Display",Inter}
#dia em{font-style:normal;color:#FF8A57}
#arrow{position:absolute;left:250px;top:1330px;width:140px;height:200px}
</style>
<body>
<div class="glow"></div>
<img id="logo" src="../../marca/logo-metodo30-blanco.png" alt="">
<div class="book" id="b1"><img src="../../ebook/tapas/tapa-consegui-trabajo.png"></div>
<div class="book" id="b2"><img src="../../ebook/tapas/tapa-secretos-de-reclutador.png"></div>
<div id="gen"><div class="k">GENERADOR DE CV</div><div class="t">Tu CV, listo</div><div class="r"><b>92</b></div><div class="s">Listo para mandar ✓</div></div>
<div id="badge"><span>🎁 Generador de CV incluido</span></div>
<div id="dia">Empezá tu <em>día 1</em></div>
<svg id="arrow" viewBox="0 0 140 200"><path d="M70 10 V160 M20 115 L70 170 L120 115" fill="none" stroke="#FF8A57" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/></svg>
<script>
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const ease = x => 1 - Math.pow(1 - clamp(x), 3);
const back = x => { x = clamp(x); const c = 1.7; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const span = (t, a, b) => clamp((t - a) / (b - a));
const $ = id => document.getElementById(id);
function render(t) {
  const l = ease(span(t, 0, 0.5));
  Object.assign($("logo").style, { opacity: l, transform: `translateY(${(1 - l) * -40}px)` });
  const b1 = back(span(t, 0.3, 0.9)), b2 = back(span(t, 0.5, 1.1)), f = Math.sin(t * 1.6) * 6;
  Object.assign($("b1").style, { left: "110px", top: (430 + f) + "px", opacity: span(t, 0.3, 0.5), transform: `rotate(${-10 * b1}deg) scale(${0.6 + 0.4 * b1})` });
  Object.assign($("b2").style, { left: "640px", top: (430 - f) + "px", opacity: span(t, 0.5, 0.7), transform: `rotate(${10 * b2}deg) scale(${0.6 + 0.4 * b2})` });
  const g = back(span(t, 1.4, 2.0));
  Object.assign($("gen").style, { opacity: span(t, 1.4, 1.6), transform: `translateY(${(1 - g) * 120}px) scale(${0.8 + 0.2 * g})` });
  const bd = back(span(t, 2.6, 3.1));
  Object.assign($("badge").style, { opacity: span(t, 2.6, 2.8), transform: `scale(${bd})` });
  const d = ease(span(t, 3.6, 4.2));
  Object.assign($("dia").style, { opacity: d, transform: `translateY(${(1 - d) * 40}px)` });
  const ar = span(t, 4.4, 4.7);
  Object.assign($("arrow").style, { opacity: ar, transform: `translateY(${Math.abs(Math.sin((t - 4.4) * 4)) * 40}px)` });
}
render(0);
</script>
